<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Dinero</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinero">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0E1116;--surf:#161B22;--surf-2:#1D2430;--line:#242C39;
  --text:#F0F3F8;--dim:#8A94A6;--dim-2:#5E6878;
  --mint:#4ADE9B;--brass:#D9A441;--coral:#F2706B;--sky:#7AA7FF;--lila:#B58CFF;
  --r:14px;--tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.mono{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Fraunces",sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}

#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(var(--safe-t) + 14px) 18px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);background:var(--ink);position:relative;z-index:5}
header h1{font-size:19px;flex:1}
#sync{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--dim-2);
  display:flex;align-items:center;gap:6px}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
#sync.ok .dot{background:var(--mint)} #sync.pend .dot{background:var(--brass)} #sync.err .dot{background:var(--coral)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--tab-h) + var(--safe-b) + 92px)}
.tab{display:none} .tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,22,.94);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 4px var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab-h) + var(--safe-b))}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--dim-2);font-weight:500;height:var(--tab-h)}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--text)}
#fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:21;width:60px;height:60px;
  border-radius:30px;background:var(--mint);color:#08130D;font-size:30px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -8px rgba(74,222,155,.55)}
#fab:active{transform:scale(.94)}

.hero{padding:28px 0 4px;text-align:center}
.hero .cifra{font-family:"Fraunces",sans-serif;font-weight:700;font-size:clamp(50px,16vw,70px);line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cifra.v,.v{color:var(--mint)} .cifra.a,.a{color:var(--brass)} .cifra.r,.r{color:var(--coral)}
.hero .pie{color:var(--dim);font-size:14.5px;margin-top:8px}
.barra{height:9px;border-radius:5px;background:var(--surf-2);overflow:hidden;margin:18px 0 9px;display:flex}
.barra i{display:block;height:100%;transition:width .35s ease}
.reinicio{font-size:12px;color:var(--dim-2);text-align:center}
.rotulo{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim-2);font-weight:600;margin:28px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rotulo span:last-child{letter-spacing:.04em;text-transform:none}
.lista{background:var(--surf);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;padding:13px 15px;
  border-top:1px solid var(--line);width:100%;text-align:left}
.lista>.row:first-child,.lista>details:first-child>summary{border-top:none}
.row .ic{font-size:16px;text-align:center}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--dim-2);font-size:11.5px;margin-top:1px}
.row .mt{font-weight:600;font-size:15px;white-space:nowrap;font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.row.hecho .tx b,.row.hecho .mt{color:var(--dim-2)}
.mt.pos{color:var(--mint)} .mt.mal{color:var(--coral)}
button.row:active{background:var(--surf-2)}
.row.sub{padding:10px 15px 10px 56px;grid-template-columns:1fr auto;background:#131820}
.row.sub .tx b{font-size:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{transition:transform .2s}
details[open]>summary .ic{transform:rotate(90deg)}
.row.total{background:var(--surf-2)}
.row.total .tx b{font-weight:700}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tile{background:var(--surf);border-radius:var(--r);padding:13px 8px;text-align:center}
.tile b{display:block;font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.tile small{display:block;color:var(--dim-2);font-size:11px;margin-top:3px}
.nota{color:var(--dim-2);font-size:12.5px;text-align:center;margin-top:12px}
.vacio{padding:24px 16px;text-align:center;color:var(--dim-2);font-size:14px}
.mesnav{display:flex;align-items:center;gap:10px;margin-top:20px}
.mesnav h2{flex:1;font-size:20px}
.mesnav button{width:38px;height:38px;border-radius:12px;background:var(--surf);display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--dim)}
.seg{display:flex;background:var(--surf);border-radius:12px;padding:3px;margin-top:16px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--surf-2);color:var(--text)}

/* cerebro */
.cerebro{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.idea{background:var(--surf);border-radius:var(--r);padding:13px 14px 13px 14px;border-left:3px solid var(--dim-2);
  font-size:14.5px;line-height:1.45}
.idea.ok{border-left-color:var(--mint)} .idea.warn{border-left-color:var(--brass)} .idea.bad{border-left-color:var(--coral)}
.idea b{font-weight:600}
.idea .acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:var(--surf-2);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.v{background:rgba(74,222,155,.14);color:var(--mint)}
.chip:active{filter:brightness(1.3)}
.cab-cerebro{display:flex;align-items:center;gap:8px;font-family:"DM Mono",monospace;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim-2);font-weight:600;margin-top:26px}
.cab-cerebro i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}

.graf{background:var(--surf);border-radius:var(--r);padding:14px 12px 8px}
.graf svg{display:block;width:100%;height:auto}
.graf text{font-family:"DM Mono",monospace;font-size:10px;fill:var(--dim-2)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 4px 4px;font-size:12px;color:var(--dim)}
.leyenda span{display:flex;align-items:center;gap:6px}
.leyenda i{width:9px;height:9px;border-radius:3px;display:inline-block}
.dona{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.caja{background:var(--surf);border-radius:var(--r);padding:16px}
.caja .big{font-family:"Fraunces",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.caja small{color:var(--dim-2);font-size:12.5px;display:block}

/* hojas */
#velo{position:fixed;inset:0;background:rgba(6,8,11,.72);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surf);border-radius:22px 22px 0 0;
  padding:16px 16px calc(16px + var(--safe-b));transform:translateY(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -14px 40px -12px rgba(0,0,0,.7);max-height:88vh;overflow-y:auto}
.hoja.on{transform:translateY(0)}
.hoja h3{font-size:18px;margin:2px 0 12px}
#pad .cab{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
#pad .cab small{color:var(--dim-2);font-size:12.5px;flex:1;text-align:right}
#monto{font-family:"Fraunces",sans-serif;font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;min-height:52px}
#monto.cero{color:var(--dim-2)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.teclas button{background:var(--surf-2);border-radius:12px;height:52px;font-family:"DM Mono",monospace;font-size:22px;font-weight:500}
.teclas button:active{background:#2A3441}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{background:var(--surf-2);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.cats button .ce{font-size:19px}
.cats button:active,.cats button.on{background:var(--mint);color:#08130D}
.cerrar{display:block;width:100%;text-align:center;color:var(--dim-2);font-size:14px;padding:14px 0 2px}
.dias{display:flex;gap:6px}
.dias button{background:var(--surf-2);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--dim)}
.dias button.on{background:var(--text);color:var(--ink)}

.campo{background:var(--surf-2);border-radius:12px;padding:11px 13px;margin-top:8px}
.campo label{display:block;font-size:10.5px;color:var(--dim-2);margin-bottom:5px;font-family:"DM Mono",monospace;
  letter-spacing:.1em;text-transform:uppercase}
.campo input,.campo select{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;
  color:var(--text);font-family:"DM Mono",monospace;font-size:15px;-webkit-appearance:none;appearance:none}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--mint)}
.lista .campo{background:var(--surf);margin:0;border-radius:0}
.btn{display:block;width:100%;background:var(--mint);color:#08130D;border-radius:12px;padding:15px;text-align:center;
  font-weight:600;font-size:16px;margin-top:12px;font-family:"Fraunces",sans-serif}
.btn.gris{background:var(--surf-2);color:var(--text)}
.btn.rojo{background:transparent;color:var(--coral);border:1px solid rgba(242,112,107,.4)}
.btn:active{filter:brightness(.92)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{font-size:13.5px;margin-top:10px;text-align:center;color:var(--dim)}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 60px);transform:translate(-50%,-20px);z-index:60;
  background:var(--text);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#iaBtn{width:34px;height:34px;border-radius:11px;background:rgba(74,222,155,.13);color:var(--mint);font-size:17px}
.preg{display:flex;align-items:center;gap:10px;width:100%;background:var(--surf);border:1px solid rgba(74,222,155,.35);border-radius:var(--r);
  padding:14px;color:var(--dim);font-size:14.5px;text-align:left;margin-top:14px}
.preg b{color:var(--mint);font-size:18px}
#chat{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
#chat.on{transform:none}
.chat-cab{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
.chat-cab b{font-family:"Fraunces",sans-serif;font-size:17px}
.chat-cab small{display:block;font-size:10.5px;color:var(--dim-2);font-family:"DM Mono",monospace}
.chat-x{color:var(--mint);font-size:14.5px;width:74px}
#chatMsgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.burbuja{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-wrap:break-word}
.burbuja.yo{align-self:flex-end;background:#1F3A2E;border-bottom-right-radius:6px}
.burbuja.yo img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:6px}
.burbuja.ia{align-self:flex-start;background:var(--surf);border-bottom-left-radius:6px}
.burbuja.err{align-self:flex-start;background:rgba(242,112,107,.12);color:var(--coral);font-size:14px}
.dim{color:var(--dim-2);font-size:12.5px}
.ia-acc{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ia-it{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14px;color:var(--text)}
.ia-it input{margin-top:3px;width:18px;height:18px;accent-color:#4ADE9B;flex:none}
.ia-it.hecha{color:var(--dim)}
.pensando{display:flex;gap:5px;padding:15px 16px}
.pensando i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bote 1s infinite}
.pensando i:nth-child(2){animation-delay:.15s}.pensando i:nth-child(3){animation-delay:.3s}
@keyframes bote{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.ia-hola{text-align:center;color:var(--dim);font-size:14.5px;padding:26px 10px 8px;line-height:1.5}
.ia-hola b{color:var(--text);display:block;margin-bottom:6px;font-size:16px}
.ia-logo{font-size:34px;color:var(--mint);margin-bottom:8px}
.ia-sug{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0}
.ia-sug .chip{font-weight:500;color:var(--text);text-align:left}
.chat-pie{border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));background:var(--ink)}
.chat-fila{display:flex;align-items:flex-end;gap:8px}
#iaTxt{flex:1;resize:none;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:var(--text);
  font:inherit;font-size:16px;max-height:120px;min-height:42px}
#iaTxt:focus{outline:none;border-color:var(--mint)}
.foto-btn{width:42px;height:42px;border-radius:21px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex:none}
#iaEnviar{width:42px;height:42px;border-radius:21px;background:var(--mint);color:#08130D;font-size:20px;font-weight:700;flex:none}
.ia-foto{position:relative;display:inline-block;margin-bottom:8px}
.ia-foto img{height:80px;border-radius:10px;display:block}
.ia-foto button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;background:var(--text);color:var(--ink);font-size:12px}
#hoja{z-index:56} #velo{z-index:55} #pad{z-index:56}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="titulo">Esta semana</h1>
    <button id="iaBtn" type="button" aria-label="Preguntarle al cerebro">✦</button>
    <button id="sync" type="button"><span class="dot"></span><span id="syncTx">—</span></button>
  </header>
  <main>
    <section class="tab on" id="t-semana"></section>
    <section class="tab" id="t-mes"></section>
    <section class="tab" id="t-flujo"></section>
    <section class="tab" id="t-gastos"></section>
    <section class="tab" id="t-mas"></section>
  </main>
  <button id="fab" type="button" aria-label="Registrar gasto">＋</button>
  <nav>
    <button class="on" data-t="semana" type="button"><span class="ic">◉</span>Semana</button>
    <button data-t="mes" type="button"><span class="ic">▤</span>Mes</button>
    <button data-t="flujo" type="button"><span class="ic">〰︎</span>Flujo</button>
    <button data-t="gastos" type="button"><span class="ic">◔</span>Gastos</button>
    <button data-t="mas" type="button"><span class="ic">▲</span>Más</button>
  </nav>
</div>

<div id="velo"></div>
<div id="pad" class="hoja">
  <div class="cab"><div id="monto" class="cero mono">$0</div><small id="padPie"></small></div>
  <div class="dias" id="padDias"></div>
  <div class="teclas" id="teclas"></div>
  <div class="cats" id="cats"></div>
  <button class="cerrar" data-cerrarhoja="1" type="button">Cancelar</button>
</div>
<div id="hoja" class="hoja"></div>
<div id="chat">
  <div class="chat-cab"><button type="button" data-chatcerrar="1" class="chat-x">‹ Volver</button>
    <button type="button" data-iapanel="1" style="flex:1;text-align:center"><b>✦ Cerebro</b><small id="iaUso"></small></button>
    <button type="button" data-iaborrar="1" class="chat-x" style="text-align:right">Borrar</button></div>
  <div id="chatMsgs"></div>
  <div class="chat-pie">
    <div id="chatFoto"></div>
    <div class="chat-fila">
      <label class="foto-btn" aria-label="Mandar captura">📷<input type="file" accept="image/*" id="iaFile" hidden></label>
      <textarea id="iaTxt" rows="1" placeholder="Pregunta o dime qué gastaste…"></textarea>
      <button id="iaEnviar" type="button" aria-label="Enviar">↑</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
/* =====================================================================
   DINERO v3 — con cerebro propio
   Todo se calcula aquí, en tu teléfono. La hoja de Google solo guarda.
   ===================================================================== */
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzO06EdQhEE_Osf_DNBfPhWVaLRU9PpQUJXY-nyNIZTQJQ5BxJwR3OvRmL37ckwE2E_eg/exec";

/* ---------- configuración original (la puedes cambiar desde Más → Ajustes) ---------- */
var BASE = {
  monto_semanal: 2300,
  meta_colchon: 30000,
  porcentaje_sat: 0.08,
  tipo_cambio: 17.5,          // pesos por dólar (para lo que cobra la IA)
  sat_dinamico: true,
  sat_fijo: 2000,
  ingresos: [

    {mes:"2026-10",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-10",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-11",fuente:"colegio",dia:1,monto:49785},
    {mes:"2026-11",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-11",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-12",fuente:"colegio",dia:1,monto:26203},
    {mes:"2026-12",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-12",fuente:"uveg",dia:30,monto:3500},
    {mes:"2027-01",fuente:"colegio",dia:1,monto:31443},
    {mes:"2027-01",fuente:"uveg",dia:15,monto:3500},
    {mes:"2027-01",fuente:"uveg",dia:30,monto:3500}
  ],
  pagos_fijos: [
    {concepto:"Carro",dia:1,monto:5000,sobre:""},
    {concepto:"Renta",dia:1,monto:2000,sobre:""},
    {concepto:"Gas",dia:1,monto:1500,sobre:""},

/* ---------- sincronización ---------- */
var sincronizando=false;
function pintarSync(estado,texto){
  if(!ENDPOINT){$("#sync").className="";$("#syncTx").textContent="solo en este teléfono";return}
  $("#sync").className=estado||"";
  $("#syncTx").textContent=texto||({ok:"al día",pend:COLA.length+" por subir",err:"sin conexión","":"local"})[estado||""];
}
function recibir(j){
  D.movimientos = j.movimientos || [];
  D.estado = j.estado || D.estado;
  normalizarEstado(); guardarLocal();
}
function sincronizar(){
  if(!ENDPOINT || sincronizando) return;
  sincronizando=true;
  var cuerpo = COLA.length ? {a:"lote",ops:COLA.slice()} : {a:"get"};
  var enviadas = COLA.length;
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(cuerpo)})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j || !j.ok) throw new Error(j && j.error ? j.error : "respuesta rara");
    COLA = COLA.slice(enviadas);
    // Si mientras tanto hubo cambios locales, el estado local manda.
    var estadoLocal = COLA.some(function(o){return o.a==="estado"}) ? D.estado : null;
    recibir(j);
    if(estadoLocal){ D.estado=estadoLocal; normalizarEstado(); }
    pintarSync(COLA.length?"pend":"ok"); pintar();
  })
  .catch(function(){ pintarSync(COLA.length?"pend":"err") })
  .then(function(){ sincronizando=false });
}

/* ================= EL CEREBRO: saldo real, flujo y avisos ================= */
function ancla(){var s=D.estado.saldos;return s.length?s[s.length-1]:null}
function selloMov(m){
  var x=/^(?:ap-)?([0-9a-z]{7,9})-/.exec(m.id||"");
  if(x){var t=parseInt(x[1],36);if(t>1.6e12&&t<4e12){var s=sello(new Date(t));if(s.slice(0,10)===m.fecha)return s}}
  return m.fecha+" 00:00:00";
}
function selloMarca(v){return typeof v==="string"?(v.length===10?v+" 00:00:00":v):"0000"}
function pagoPorId(mk,id){return pagosDelMes(mk).filter(function(p){return p.id===id})[0]}
// Qué pasó en el banco después de la última vez que me diste tu saldo.
function cambiosDesde(a){
  var ts=a.ts, ad=ts.slice(0,10), out=[], prev=D.estado.previos||{};
  D.movimientos.forEach(function(m){
    if(m.es_efectivo||prev[m.id]) return;
    if(m.fecha>=ad && selloMov(m)>ts) out.push({fecha:m.fecha,concepto:cat(m.categoria).nombre+(m.nota?" · "+m.nota:""),monto:-m.monto,tipo:"gasto"});
  });
  Object.keys(D.estado.checklist).forEach(function(mk){
    var c=D.estado.checklist[mk];
    Object.keys(c).forEach(function(id){
      var p=pagoPorId(mk,id); if(!p) return;
      if(fechaDe(mk,p.dia)>=ad && selloMarca(c[id])>ts) out.push({fecha:fechaDe(mk,p.dia),concepto:p.concepto,monto:-p.monto,tipo:"pago"});
    });
  });
  Object.keys(D.estado.recibidos).forEach(function(mk){
    var r=D.estado.recibidos[mk];
    Object.keys(r).forEach(function(k){
      var dia=+k.split(":")[1]||1, x=r[k];
      if(fechaDe(mk,dia)>=ad && (x.ts||x.fecha+" 00:00:00")>ts) out.push({fecha:fechaDe(mk,dia),concepto:nombreFuente(k.split(":")[0]),monto:x.monto,tipo:"ingreso"});
    });
  });
  D.estado.eventos.forEach(function(e){
    if(e.hecho && e.fecha>=ad && selloMarca(e.hecho)>ts) out.push({fecha:e.fecha,concepto:e.concepto,monto:e.monto,tipo:"evento"});
  });
  return out;
}
function saldoActual(){var a=ancla();if(!a)return null;return a.monto+suma(cambiosDesde(a))}

// Todo lo que falta que entre o salga, del día a al día b.
function eventosEntre(a,b){
  var out=[], mk=a.slice(0,7), fin=b.slice(0,7), g=0;
  while(mk<=fin && g++<40){
    ingresosDelMes(mk).forEach(function(i){
      if(recibidoDe(mk,i)) return;
      out.push({fecha:fechaDe(mk,i.dia),concepto:nombreFuente(i.fuente),monto:i.monto,tipo:"ingreso",mk:mk,ref:idIng(i)});
    });
    pagosDelMes(mk).forEach(function(p){
      if(marcaDe(mk,p.id)) return;
      out.push({fecha:fechaDe(mk,p.dia),concepto:p.concepto,monto:-p.monto,tipo:"pago",mk:mk,ref:p.id,bloque:p.bloque});
    });
    mk=sigMes(mk);
  }
  D.estado.eventos.forEach(function(e){
    if(!e.hecho) out.push({fecha:e.fecha,concepto:e.concepto,monto:e.monto,tipo:"evento",ref:e.id});
  });
  return out.filter(function(e){return e.fecha>=a&&e.fecha<=b}).sort(function(x,y){return x.fecha<y.fecha?-1:1});
}

function flujo(nDias){
  var a=ancla(); if(!a) return null;
  nDias=nDias||45;
  var hoy=hoyYmd(), inicio=saldoActual(), ad=a.ts.slice(0,10);
  var fin=masDias(hoy,nDias-1);
  var evs=eventosEntre(ad<hoy?ad:hoy,fin).map(function(e){
    var x=Object.assign({},e); if(x.fecha<hoy){x.atrasado=x.fecha;x.fecha=hoy} return x});
  // los ingresos atrasados no se cuentan hasta que los marques
  evs=evs.filter(function(e){return !(e.atrasado&&e.monto>0)});
  var s=saldoSemana(hoy), finSem=masDias(lunesYmd(hoy),6), rest=difDias(hoy,finSem)+1;
  var dias=[], bal=inicio, sin=inicio, low=null, sig=null;
  for(var i=0;i<nDias;i++){
    var d=masDias(hoy,i), del=evs.filter(function(e){return e.fecha===d});
    var tot=suma(del);
    var disc=d<=finSem?Math.max(0,s.saldo)/rest:CFG.monto_semanal/7;
    bal+=tot-disc; sin+=tot;
    var x={fecha:d,evs:del,disc:disc,bal:bal,sin:sin};
    dias.push(x);
    if(!low||bal<low.bal) low=x;
    if(!sig&&i>0&&del.some(function(e){return e.tipo==="ingreso"||(e.tipo==="evento"&&e.monto>0)})) sig={fecha:d,evs:del};
  }
  // cuánto puedes gastar al día sin quedarte en ceros antes del próximo ingreso
  var hasta=sig?masDias(sig.fecha,-1):fin, seguro=Infinity, diasH=0;
  dias.forEach(function(x,i){if(x.fecha<=hasta){diasH=i+1;seguro=Math.min(seguro,x.sin/(i+1))}});
  if(!isFinite(seguro)) seguro=0;
  return {inicio:inicio,dias:dias,low:low,sig:sig,hasta:hasta,diasH:diasH,seguro:Math.max(0,seguro),
    semanal:CFG.monto_semanal/7,ancla:a};
}

        (f.sig?"Para llegar al "+corta(f.sig.fecha)+" sin quedarte en ceros, gasta máximo <b>"+mx(f.seguro)+" al día</b>.":""),acc:[["Ver flujo","flujo"]]});
    }else{
      I.push({n:"ok",t:"Tu saldo estimado es <b>"+mx(f.inicio)+"</b>. Tu día más apretado: <b>"+cortaDia(f.low.fecha)+"</b> con "+mx(f.low.bal)+
        (f.sig?". Hasta el "+corta(f.sig.fecha)+" aguantas <b>"+mx(f.seguro)+"/día</b>.":"."),acc:[["Ver flujo","flujo"]]});
    }
    if(hace>=3) I.push({n:"warn",t:"Hace "+hace+" días que no me das tu saldo. Si me lo das, reviso que no se te haya escapado ningún gasto.",acc:[["Poner mi saldo","saldo"]]});
  }
  // 3. gastos que parecen pagos
  sospechas().slice(0,3).forEach(function(x){
    I.push({n:"warn",t:"El gasto de <b>"+mx2(x.mov.monto)+"</b> ("+cat(x.mov.categoria).nombre.toLowerCase()+", "+corta(x.mov.fecha)+") parece ser <b>"+esc(x.pago.concepto)+"</b>. Si lo es, lo saco de tu semana y lo palomeo.",
      acc:[["Sí, es "+x.pago.concepto,"mover:"+x.mov.id+"|"+x.mk+"|"+x.pago.id],["No","ignorar:"+x.mov.id+"|"+x.pago.id]]});
  });
  // 4. pagos cuya fecha ya pasó y no están palomeados
  var venc=pagosVencidos(mk);
  if(venc.length){
    I.push({n:"warn",t:"Ya pasó la fecha de <b>"+venc.slice(0,5).map(function(p){return esc(p.concepto)}).join(", ")+(venc.length>5?" y "+(venc.length-5)+" más":"")+
      "</b> ("+mx(suma(venc))+") y no están palomeados. ¿Ya salieron?",acc:[["Palomear todos","palomear:"+mk],["Revisar","mes-lista"]]});
  }
  // 5. ingresos que ya debieron caer
  ingresosDelMes(mk).forEach(function(i){
    if(i.dia<=+hoy.slice(8,10)&&!recibidoDe(mk,i))
      I.push({n:"warn",t:"¿Ya cayó <b>"+nombreFuente(i.fuente)+"</b> del día "+i.dia+" ("+mx(i.monto)+")?",acc:[["Sí, ya cayó","ingreso:"+mk+"|"+idIng(i)]]});
  });
  // 6. lo que viene en 7 días
  var prox=eventosEntre(masDias(hoy,1),masDias(hoy,7)).filter(function(e){return e.monto<0});
  if(prox.length) I.push({n:"",t:"En los próximos 7 días salen <b>"+mx(-suma(prox))+"</b>: "+
    prox.slice(0,6).map(function(e){return esc(e.concepto)+" "+corta(e.fecha)}).join(" · ")+(prox.length>6?"…":"")});
  // 7. en qué se va el dinero
  var ms=movsSemana(hoy);
  if(ms.length){
    var por={};ms.forEach(function(m){por[m.categoria]=(por[m.categoria]||0)+m.monto});
    var top=Object.keys(por).sort(function(x,y){return por[y]-por[x]})[0];
    var prev=[1,2,3,4].map(function(k){return movsSemana(masDias(hoy,-7*k))}).filter(function(a){return a.length});
    var t="Lo que más se lleva tu semana: <b>"+cat(top).nombre+"</b> con "+mx(por[top])+" ("+Math.round(por[top]/s.gastado*100)+"%).";
    if(prev.length){
      var prom=prev.reduce(function(a,w){return a+suma(w.filter(function(m){return m.categoria===top}))},0)/prev.length;
      if(prom>0){var dif=por[top]-prom;
        t+=" Tu promedio es "+mx(prom)+(dif>prom*0.25?", vas <b>arriba</b>.":(dif<-prom*0.25?", vas abajo 👍":", vas normal."))}
    }
    I.push({n:"",t:t});
  }
  // 7b. saldo de la IA
  try{ var sI=iaSaldo(); if(sI&&sI.usd<1.5) I.push({n:sI.usd<0.5?"bad":"warn",t:"Tu saldo de la IA (Anthropic) va en <b>US$"+Math.max(0,sI.usd).toFixed(2)+"</b>. Cuando se acabe se apaga el ✦ aquí y el cerebro de EFA.",acc:[["Ver","iapanel"]]}) }catch(e){}
  // 8. colchón
  var c=colchonActual(), pc=proyeccionColchon(), llega=pc.filter(function(x){return x.acum>=CFG.meta_colchon})[0];
  I.push({n:"",t:"Colchón: <b>"+mx(c)+"</b> de "+mx(CFG.meta_colchon)+"."+(llega?" A este ritmo lo completas en <b>"+nombreMes(llega.mes)+"</b>.":"")});
  var dm=depColegio(sigMes(mk)); if(dm>30000) I.push({n:"ok",t:"El "+corta(sigMes(mk)+"-01")+" es <b>mes alto</b>: caen "+mx(dm)+". Lo que sobre de "+mx(30000)+" va directo al colchón."});
  return I;
}

/* ================= GRÁFICAS (SVG hecho a mano) ================= */
function svgBarras(cols, ref, alto){
  // cols: [{label, partes:[{v,color}], marca}]
  alto=alto||140; var W=320, H=alto, pb=18, pt=8, n=cols.length, gw=W/n, bw=Math.min(28,gw*0.62);
  var max=Math.max(ref||0,1); cols.forEach(function(c){max=Math.max(max,c.partes.reduce(function(a,p){return a+p.v},0))});
  var y=function(v){return pt+(H-pb-pt)*(1-v/max)}, s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  if(ref) s+='<line x1="0" x2="'+W+'" y1="'+y(ref)+'" y2="'+y(ref)+'" stroke="#5E6878" stroke-dasharray="3 4"/>';
  cols.forEach(function(c,i){
    var x=i*gw+(gw-bw)/2, acc=0;
    c.partes.forEach(function(p){ if(p.v<=0) return;
      var y1=y(acc+p.v), y0=y(acc); s+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(1,y0-y1)+'" fill="'+p.color+'" rx="2"/>'; acc+=p.v});
    if(!acc) s+='<rect x="'+x+'" y="'+(H-pb-2)+'" width="'+bw+'" height="2" fill="#242C39"/>';
    s+='<text x="'+(i*gw+gw/2)+'" y="'+(H-4)+'" text-anchor="middle"'+(c.marca?' style="fill:#F0F3F8;font-weight:600"':'')+'>'+esc(c.label)+'</text>';
  });
  return s+'</svg>';
}
function svgDona(partes, centro, sub){
  var R=52, C=2*Math.PI*R, tot=partes.reduce(function(a,p){return a+p.v},0), off=0;
  var s='<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="'+R+'" fill="none" stroke="#1D2430" stroke-width="16"/>';
  if(tot>0) partes.forEach(function(p){ var l=C*p.v/tot;
    s+='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+
       '" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 66 66)"/>'; off+=l });
  s+='<text x="66" y="66" text-anchor="middle" style="font-size:17px;fill:#F0F3F8;font-weight:600">'+esc(centro)+'</text>';
  s+='<text x="66" y="83" text-anchor="middle">'+esc(sub||"")+'</text>';
  return s+'</svg>';
}
function svgLinea(dias){
  var W=320,H=170,pl=4,pr=4,pt=14,pb=20,n=dias.length;
  var vals=dias.map(function(d){return d.bal}), min=Math.min(0,Math.min.apply(null,vals)), max=Math.max.apply(null,vals.concat([1]));
  var pad=(max-min)*0.08; max+=pad; min-=pad*(min<0?1:0);
  var x=function(i){return pl+(W-pl-pr)*i/Math.max(1,n-1)}, y=function(v){return pt+(H-pt-pb)*(1-(v-min)/(max-min||1))};
  var pts=dias.map(function(d,i){return x(i).toFixed(1)+","+y(d.bal).toFixed(1)}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  s+='<defs><linearGradient id="gl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4ADE9B" stop-opacity=".28"/><stop offset="1" stop-color="#4ADE9B" stop-opacity="0"/></linearGradient></defs>';
  s+='<polygon points="'+x(0)+','+y(min)+' '+pts+' '+x(n-1)+','+y(min)+'" fill="url(#gl)"/>';
  s+='<line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#F2706B" stroke-opacity=".55" stroke-dasharray="3 4"/>';
  dias.forEach(function(d,i){ if(d.fecha.slice(8)==="01"||i===0)
    s+='<line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#242C39"/><text x="'+(x(i)+3)+'" y="'+(H-6)+'">'+corta(d.fecha)+'</text>' });
  s+='<polyline points="'+pts+'" fill="none" stroke="#4ADE9B" stroke-width="2" stroke-linejoin="round"/>';
  dias.forEach(function(d,i){ if(d.evs.some(function(e){return e.monto>0}))
    s+='<circle cx="'+x(i)+'" cy="'+y(d.bal)+'" r="3.2" fill="#D9A441"/>' });
  var li=0; dias.forEach(function(d,i){if(d.bal<dias[li].bal)li=i});
  s+='<circle cx="'+x(li)+'" cy="'+y(dias[li].bal)+'" r="4.5" fill="#F2706B" stroke="#0E1116" stroke-width="2"/>';
  var tx=Math.min(Math.max(x(li),40),W-40);
  s+='<text x="'+tx+'" y="'+Math.max(11,y(dias[li].bal)-9)+'" text-anchor="middle" style="fill:#F2706B;font-weight:600">'+mx(dias[li].bal)+'</text>';
  return s+'</svg>';
}

function mesLista(mk,marcas,movs){
  var ya=[],falta=[];
  ingresosDelMes(mk).forEach(function(i){var r=recibidoDe(mk,i);
    (r?ya:falta).push({tipo:"ingreso",ic:r?"💰":"⬜️",tit:nombreFuente(i.fuente),dia:i.dia,monto:r?r.monto:i.monto,hecho:!!r,
      sub:"día "+i.dia+(r?" · marcado el "+corta(r.fecha):""),ref:idIng(i)})});
  pagosDelMes(mk).forEach(function(p){var m=marcas[p.id];
    (m?ya:falta).push({tipo:"pago",ic:m?"✅":"⬜️",tit:p.concepto,dia:p.dia,monto:p.monto,hecho:!!m,
      sub:"día "+p.dia+(p.sobre?" · sobre "+p.sobre:"")+(typeof m==="string"?" · pagado "+corta(m.slice(0,10)):""),ref:p.id})});

function cerrarHojas(){ ["#hoja","#pad","#velo"].forEach(function(s){$(s).classList.remove("on")}) }
function campo(id,label,valor,tipo,extra){
  if(tipo==="select") return '<div class="campo"><label>'+label+'</label><select id="'+id+'">'+extra.map(function(o){
    return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(valor)?" selected":"")+'>'+esc(o[1])+'</option>'}).join("")+'</select></div>';
  return '<div class="campo"><label>'+label+'</label><input id="'+id+'" '+(tipo==="num"?'inputmode="decimal" type="text"':(tipo==="date"?'type="date"':'type="text"'))+

function guardarGasto(id){
  var m=buscarMov(id); if(!m) return;
  var n=num(val("g-monto")); if(n===null||n<=0){toast("Revisa el monto");return}
  var sel=document.querySelector("#g-cats button.on");
  m.monto=Math.round(n*100)/100; if(sel) m.categoria=sel.dataset.gcatsel;
  if(/^\d{4}-\d{2}-\d{2}$/.test(val("g-fecha"))) m.fecha=val("g-fecha");
  m.nota=val("g-nota").trim(); m.es_efectivo=val("g-ef")==="1";
  if(document.getElementById("g-prev")){ if(!D.estado.previos)D.estado.previos={};
    if(val("g-prev")==="1") D.estado.previos[m.id]=true; else delete D.estado.previos[m.id]; encolarEstado() }
  guardarLocal(); encolar({a:"edit",mov:m}); cerrarHojas(); pintar(); toast("Guardado");
}
function agregarGasto(monto,cat,fecha,nota){
  var m={id:uid(),fecha:fecha||hoyYmd(),monto:Math.round(monto*100)/100,categoria:cat,es_efectivo:false,nota:nota||""};
  D.movimientos.push(m); guardarLocal(); encolar({a:"add",mov:m}); pintar(); return m;
}
function borrarGasto(id){
  D.movimientos=D.movimientos.filter(function(m){return m.id!==id});
  guardarLocal(); encolar({a:"del",id:id}); pintar();
}
function moverAPago(gid,mk,pid){
  var m=buscarMov(gid); if(!m) return;
  if(!D.estado.checklist[mk]) D.estado.checklist[mk]={};
  D.estado.checklist[mk][pid]=selloMov(m);
  D.movimientos=D.movimientos.filter(function(x){return x.id!==gid});
  guardarLocal(); encolar({a:"del",id:gid}); encolarEstado(); cerrarHojas(); pintar();
  var p=pagoPorId(mk,pid); toast("Listo: "+(p?p.concepto:"pago")+" palomeado y fuera de tu semana");
}

function descAccion(a){
  if(a.desc) return a.desc;
  var m=a.monto!=null?mx2(Math.abs(a.monto)):"";
  switch(a.tipo){
    case "agregar_gasto": return "Agregar gasto "+m+" · "+cat(a.categoria).nombre+(a.nota?" ("+a.nota+")":"")+" · "+corta(a.fecha||hoyYmd());
    case "editar_gasto": var g=buscarMov(a.id); return "Editar gasto "+(g?mx2(g.monto)+" del "+corta(g.fecha):a.id)+" → "+
      [a.monto!=null?m:"",a.categoria?cat(a.categoria).nombre:"",a.fecha?corta(a.fecha):"",a.nota||""].filter(Boolean).join(", ");
    case "borrar_gasto": var g2=buscarMov(a.id); return "Borrar gasto "+(g2?mx2(g2.monto)+" "+cat(g2.categoria).nombre+" del "+corta(g2.fecha):a.id);
    case "mover_a_pago": var g3=buscarMov(a.id), p=pagoPorId(a.mes||"",a.pago_id||""); return "Sacar "+(g3?mx2(g3.monto):"el gasto")+" de la semana y palomear "+(p?p.concepto:a.pago_id);
    case "palomear": var p2=pagoPorId(a.mes||"",a.pago_id||""); return "Palomear "+(p2?p2.concepto+" "+mx(p2.monto):a.pago_id)+" de "+(a.mes?MESES[+a.mes.slice(5,7)-1]:"");
    case "despalomear": var p3=pagoPorId(a.mes||"",a.pago_id||""); return "Quitar palomita a "+(p3?p3.concepto:a.pago_id);
    case "marcar_ingreso": return "Marcar que cayó "+(a.ref||"")+" "+m;
    case "poner_saldo": return "Guardar saldo de BBVA: "+m;
    case "agregar_evento": return "Movimiento único: "+(a.concepto||"")+" "+(a.monto>0?"+":"−")+m+" el "+corta(a.fecha||hoyYmd());
    case "cambiar_semanal": return "Cambiar tu semana a "+m;
    case "config_item": return ({agregar:"Agregar",cambiar:"Cambiar",borrar:"Borrar"}[a.operacion]||"Cambiar")+" en "+(a.seccion||"")+": "+(a.concepto||a.fuente||"")+
      (a.monto!=null?" "+m:"")+(a.dia?" día "+a.dia:"");
  }
  return a.tipo;
}
function fechaOk(f){return /^\d{4}-\d{2}-\d{2}$/.test(f||"")?f:hoyYmd()}
function catOk(c){return CFG.categorias.some(function(x){return x.id===c})?c:"otro"}
function aplicarUna(a){
  var t=a.tipo;
  if(t==="agregar_gasto"){ if(!(a.monto>0)) throw "monto";
    var m={id:uid(),fecha:fechaOk(a.fecha),monto:r2(a.monto),categoria:catOk(a.categoria),es_efectivo:!!a.efectivo,nota:a.nota||""};
    D.movimientos.push(m); encolar({a:"add",mov:m}); return }
  if(t==="editar_gasto"){ var g=buscarMov(a.id); if(!g) throw "no encontré el gasto";
    if(a.monto>0) g.monto=r2(a.monto); if(a.categoria) g.categoria=catOk(a.categoria);
    if(a.fecha) g.fecha=fechaOk(a.fecha); if(a.nota!=null) g.nota=a.nota; if(a.efectivo!=null) g.es_efectivo=!!a.efectivo;
    encolar({a:"edit",mov:g}); return }
  if(t==="borrar_gasto"){ if(!buscarMov(a.id)) throw "no encontré el gasto";
    D.movimientos=D.movimientos.filter(function(x){return x.id!==a.id}); encolar({a:"del",id:a.id}); return }
  if(t==="mover_a_pago"){ var g2=buscarMov(a.id); if(!g2) throw "no encontré el gasto";
    var mk=a.mes||g2.fecha.slice(0,7); if(!pagoPorId(mk,a.pago_id)) throw "no encontré el pago";
    if(!D.estado.checklist[mk]) D.estado.checklist[mk]={}; D.estado.checklist[mk][a.pago_id]=selloMov(g2);
    D.movimientos=D.movimientos.filter(function(x){return x.id!==a.id}); encolar({a:"del",id:a.id}); return }
  if(t==="palomear"||t==="despalomear"){ if(!pagoPorId(a.mes,a.pago_id)) throw "no encontré el pago";
    if(!D.estado.checklist[a.mes]) D.estado.checklist[a.mes]={};
    if(t==="palomear") D.estado.checklist[a.mes][a.pago_id]=a.fecha?fechaOk(a.fecha):sello(); else delete D.estado.checklist[a.mes][a.pago_id]; return }
  if(t==="marcar_ingreso"){ var ing=ingresosDelMes(a.mes||"").filter(function(i){return idIng(i)===a.ref})[0]; if(!ing) throw "no encontré el ingreso";
    if(!D.estado.recibidos[a.mes]) D.estado.recibidos[a.mes]={};
    D.estado.recibidos[a.mes][a.ref]={monto:r2(a.monto>0?a.monto:ing.monto),fecha:hoyYmd(),ts:sello()}; return }
  if(t==="poner_saldo"){ if(a.monto==null) throw "monto"; D.estado.saldos.push({monto:r2(a.monto),ts:sello(),esperado:saldoActual()}); D.estado.previos={}; return }
  if(t==="agregar_evento"){ if(!a.monto||!a.concepto) throw "faltan datos";
    D.estado.eventos.push({id:uid(),concepto:a.concepto,fecha:fechaOk(a.fecha),monto:r2(a.monto),hecho:null}); return }
  if(t==="cambiar_semanal"){ if(!(a.monto>0)) throw "monto"; CFG.monto_semanal=a.monto; D.estado.cfg=clon(CFG); return }
  if(t==="config_item"){
    var sec=CFG[a.seccion]; if(!Array.isArray(sec)) throw "sección";
    var i=-1, nom=String(a.concepto||"").toLowerCase();
    sec.forEach(function(x,k){ if(i>=0) return;
      if(a.seccion==="ingresos"){ if(x.mes===a.mes&&x.fuente===(a.fuente||x.fuente)&&(!a.dia||x.dia===a.dia)) i=k }
      else if(String(x.concepto).toLowerCase()===nom&&(!a.dia||x.dia===a.dia||a.operacion==="cambiar")) i=k });
    if(a.operacion==="borrar"){ if(i<0) throw "no lo encontré"; sec.splice(i,1) }
    else if(a.operacion==="agregar"||i<0){
      var n=a.seccion==="ingresos"?{mes:a.mes,fuente:(a.fuente||"otro").toLowerCase(),dia:a.dia||1,monto:a.monto||0}
        :{concepto:a.concepto,dia:a.dia||1,monto:a.monto||0};
      if(a.seccion==="suscripciones") n.bloque=a.bloque||"dia_15"; if(a.seccion==="pagos_fijos") n.sobre=a.sobre||"";
      if(a.seccion==="ingresos"&&!/^\d{4}-\d{2}$/.test(n.mes||"")) throw "mes"; if(a.seccion!=="ingresos"&&!n.concepto) throw "concepto";
      sec.push(n) }
    else { var x=sec[i]; if(a.monto!=null) x.monto=a.monto; if(a.dia) x.dia=a.dia; if(a.bloque&&a.seccion==="suscripciones") x.bloque=a.bloque;
      if(a.sobre!=null&&a.seccion==="pagos_fijos") x.sobre=a.sobre }
    D.estado.cfg=clon(CFG); return }
  throw "no sé hacer "+t;
}
function aplicarAcciones(idx){

  if(IA_OCUPADA) h+='<div class="burbuja ia pensando"><i></i><i></i><i></i></div>';
  $("#chatMsgs").innerHTML=h;
  $("#iaUso").textContent=textoUso();
  $("#chatFoto").innerHTML=IA_FOTO?'<div class="ia-foto"><img src="'+IA_FOTO+'" alt=""><button type="button" data-iaquitarfoto="1">✕</button></div>':"";
  var box=$("#chatMsgs"); box.scrollTop=box.scrollHeight;
}
function leerFoto(file){
  var fr=new FileReader();
  fr.onload=function(){ var img=new Image(); img.onload=function(){
      var k=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      IA_FOTO=c.toDataURL("image/jpeg",0.82); pintarChat() };
    img.src=fr.result };
  fr.readAsDataURL(file);
}
function enviarIA(texto){
  texto=String(texto||"").trim();
  if(IA_OCUPADA||(!texto&&!IA_FOTO)) return;
  if(!ENDPOINT){ toast("Primero conecta tu hoja en Más"); return }
  var foto=IA_FOTO; IA_FOTO=null;
  if(!texto) texto="Revisa esta captura contra lo que tengo en la app.";
  // historial corto: solo texto, para que sea barato
  var hist=[]; CHAT.slice(-8).forEach(function(m){
    if(m.rol==="yo") hist.push({role:"user",content:m.texto||"(captura)"});
    else if(m.rol==="ia") hist.push({role:"assistant",content:(m.texto||"")+(m.acciones&&m.acciones.length?"\n[Propuse: "+m.acciones.map(descAccion).join("; ")+(m.aplicadas?" — él lo aplicó":" — no lo ha aplicado")+"]":"")});
  });
  // la API pide que se alternen: fusiono seguidos del mismo rol
  var msgs=[]; hist.forEach(function(x){var u=msgs[msgs.length-1]; if(u&&u.role===x.role) u.content+="\n"+x.content; else msgs.push(x)});
  if(msgs.length&&msgs[0].role!=="user") msgs.shift();
  var cont=[];
  if(foto) cont.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:foto.split(",")[1]}});
  cont.push({type:"text",text:"CONTEXTO DE LA APP (datos al momento):\n"+contexto()+"\n\nBRIAN DICE:\n"+texto});
  if(msgs.length&&msgs[msgs.length-1].role==="user"){ var prev=msgs.pop(); cont.unshift({type:"text",text:"(antes dijo: "+prev.content+")"}) }
  msgs.push({role:"user",content:cont});
  CHAT.push({rol:"yo",texto:texto,img:foto?foto:null,foto:!!foto}); IA_OCUPADA=true; $("#iaTxt").value=""; pintarChat();
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({a:"ia",sistema:IA_SISTEMA,mensajes:msgs,herramienta:IA_HERRAMIENTA})})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j||!j.ok) throw new Error(j&&j.error?j.error:"respuesta rara");
    var costo=sumarUso(j.uso,j.modelo);
    var r=j.r||{}, acc=Array.isArray(r.acciones)?r.acciones:[]; acc.forEach(function(a){a.desc=descAccion(a)});
    CHAT.push({rol:"ia",texto:r.respuesta||"(sin respuesta)",acciones:acc,costo:costo});
  })
  .catch(function(e){
    var t=String(e.message||e);
    if(/Acción desconocida/.test(t)) t="Tu hoja todavía tiene el código viejo. Pega el Dinero-Datos.gs nuevo y publica una versión nueva (pasos 5–9).";
    else if(/llave|GEMINI|ANTHROPIC/i.test(t)) t="Falta configurar la llave de la IA en tu Apps Script. "+t;
    else if(/Failed to fetch|Load failed|NetworkError/i.test(t)) t="No hay conexión. Inténtalo en un momento.";
    CHAT.push({rol:"error",texto:t});
  })
  .then(function(){IA_OCUPADA=false;guardarChat();pintarChat()});
}

/* ================= ARRANQUE ================= */
cargarLocal(); montarTeclado(); pintar();
pintarSync(ENDPOINT?(COLA.length?"pend":"ok"):""); sincronizar();
setInterval(sincronizar,60000);
window.addEventListener("online",sincronizar);
document.addEventListener("visibilitychange",function(){if(!document.hidden){pintar();sincronizar()}});
$("#iaFile").addEventListener("change",function(e){var fl=e.target.files&&e.target.files[0];if(fl)leerFoto(fl);e.target.value=""});
$("#iaTxt").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviarIA(this.value)}});
try{if(new URLSearchParams(location.search).get("ia"))abrirChat()}catch(e){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
