<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Dinero</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinero">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============ 1. IDENTIDAD ============ */
:root{
  --ink:#0E1116;
  --surf:#161B22;
  --surf-2:#1D2430;
  --line:#242C39;
  --text:#F0F3F8;
  --dim:#8A94A6;
  --dim-2:#5E6878;
  --mint:#4ADE9B;
  --brass:#D9A441;
  --coral:#F2706B;
  --r:14px;
  --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Archivo",sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}

/* ============ 2. ARMAZÓN ============ */
#app{display:flex;flex-direction:column;height:100%}
header{
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  background:var(--ink);position:relative;z-index:5
}
header h1{font-size:19px;flex:1}
#sync{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--dim-2);display:flex;align-items:center;gap:6px;text-align:right
}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
#sync.ok .dot{background:var(--mint)}
#sync.pend .dot{background:var(--brass)}
#sync.err .dot{background:var(--coral)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(var(--tab-h) + var(--safe-b) + 92px)}
.tab{display:none}
.tab.on{display:block}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(14,17,22,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:0 6px calc(var(--safe-b));
  display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tab-h) + var(--safe-b))
}
nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--dim-2);font-weight:500;height:var(--tab-h)
}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--text)}
nav button.on .ic{filter:none}

#fab{
  position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:21;
  width:60px;height:60px;border-radius:30px;background:var(--mint);color:#08130D;
  font-size:30px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 28px -8px rgba(74,222,155,.55)
}
#fab:active{transform:scale(.94)}

/* ============ 3. PIEZAS ============ */
.hero{padding:34px 0 6px;text-align:center}
.hero .cifra{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(52px,17vw,72px);
  line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.hero .cifra.v{color:var(--mint)} .hero .cifra.a{color:var(--brass)} .hero .cifra.r{color:var(--coral)}
.hero .pie{color:var(--dim);font-size:14.5px;margin-top:8px}
.barra{height:9px;border-radius:5px;background:var(--surf-2);overflow:hidden;margin:20px 0 9px}
.barra i{display:block;height:100%;border-radius:5px;transition:width .35s ease}
.reinicio{font-size:12px;color:var(--dim-2);text-align:center}

.rotulo{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim-2);font-weight:600;
  margin:30px 0 10px;display:flex;justify-content:space-between;align-items:center
}
.rotulo span:last-child{letter-spacing:.04em}

.lista{background:var(--surf);border-radius:var(--r);overflow:hidden}
.row{
  display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;
  padding:13px 15px;border-top:1px solid var(--line);width:100%;text-align:left
}
.lista .row:first-child{border-top:none}
.row .ic{font-size:16px;text-align:center}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--dim-2);font-size:11.5px;margin-top:1px}
.row .mt{font-weight:600;font-size:15px;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.row.hecho .tx b,.row.hecho .mt{color:var(--dim-2)}
.mt.pos{color:var(--mint)} .mt.neg{color:var(--text)} .mt.mal{color:var(--coral)}
.row:active{background:var(--surf-2)}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.tile{background:var(--surf);border-radius:var(--r);padding:14px 10px;text-align:center}
.tile b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.tile small{display:block;color:var(--dim-2);font-size:11px;margin-top:3px}
.nota{color:var(--dim-2);font-size:12.5px;text-align:center;margin-top:12px}

.mesnav{display:flex;align-items:center;gap:10px;margin-top:22px}
.mesnav h2{flex:1;font-size:20px}
.mesnav button{
  width:38px;height:38px;border-radius:12px;background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)
}

.vacio{padding:26px 16px;text-align:center;color:var(--dim-2);font-size:14px}

/* ============ 4. TECLADO ============ */
#velo{
  position:fixed;inset:0;background:rgba(6,8,11,.72);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
#velo.on{opacity:1;pointer-events:auto}
#pad{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--surf);border-radius:22px 22px 0 0;
  padding:16px 16px calc(16px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -14px 40px -12px rgba(0,0,0,.7)
}
#pad.on{transform:translateY(0)}
#pad .cab{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
#pad .cab small{color:var(--dim-2);font-size:12.5px;flex:1}
#monto{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:44px;line-height:1.1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-height:52px
}
#monto.cero{color:var(--dim-2)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.teclas button{
  background:var(--surf-2);border-radius:12px;height:54px;
  font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500
}
.teclas button:active{background:#2A3441}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{
  background:var(--surf-2);border-radius:12px;padding:11px 4px;font-size:11.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.2
}
.cats button .ce{font-size:19px}
.cats button:active{background:var(--mint);color:#08130D}
#pad .cerrar{display:block;width:100%;text-align:center;color:var(--dim-2);font-size:14px;padding:14px 0 2px}

/* ============ 5. AJUSTES ============ */
.campo{background:var(--surf);border-radius:var(--r);padding:15px;margin-top:10px}
.campo label{display:block;font-size:12px;color:var(--dim-2);margin-bottom:7px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.campo input{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:13px
}
.campo input:focus{outline:none;border-color:var(--mint)}
.btn{
  display:block;width:100%;background:var(--mint);color:#08130D;border-radius:12px;
  padding:15px;text-align:center;font-weight:600;font-size:16px;margin-top:12px;
  font-family:"Archivo",sans-serif
}
.btn.gris{background:var(--surf-2);color:var(--text)}
.btn:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="titulo">Esta semana</h1>
    <button id="sync" class="" type="button"><span class="dot"></span><span id="syncTx">—</span></button>
  </header>

  <main>
    <section class="tab on" id="t-semana"></section>
    <section class="tab" id="t-mes"></section>
    <section class="tab" id="t-sobres"></section>
    <section class="tab" id="t-colchon"></section>
  </main>

  <button id="fab" type="button" aria-label="Registrar gasto">＋</button>

  <nav>
    <button class="on" data-t="semana" type="button"><span class="ic">◉</span>Semana</button>
    <button data-t="mes" type="button"><span class="ic">▤</span>Mes</button>
    <button data-t="sobres" type="button"><span class="ic">✉</span>Sobres</button>
    <button data-t="colchon" type="button"><span class="ic">▲</span>Colchón</button>
  </nav>
</div>

<div id="velo"></div>
<div id="pad">
  <div class="cab">
    <div id="monto" class="cero mono">0</div>
    <small id="padPie"></small>
  </div>
  <div class="teclas" id="teclas"></div>
  <div class="cats" id="cats"></div>
  <button class="cerrar" id="padCerrar" type="button">Cancelar</button>
</div>

<script>
/* =====================================================================
   DINERO — app web
   Los datos viven en tu hoja de Google y en este teléfono.
   Pega tu dirección en ENDPOINT o ponla desde Colchón → Ajustes.
   ===================================================================== */
// Tu hoja de Google. Si algún día vuelves a publicar el Apps Script y cambia
// la dirección, cámbiala aquí o desde la app en Colchón → Ajustes.
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzO06EdQhEE_Osf_DNBfPhWVaLRU9PpQUJXY-nyNIZTQJQ5BxJwR3OvRmL37ckwE2E_eg/exec";

/* ---------- configuración del sistema ---------- */
var CFG = {
  monto_semanal: 2300,
  meta_colchon: 30000,
  porcentaje_sat: 0.08,
  sat_dinamico: true,
  sat_fijo: 2000,
  ingresos: [
    {mes:"2026-10",fuente:"colegio",dia:1,monto:26203},
    {mes:"2026-10",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-10",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-11",fuente:"colegio",dia:1,monto:49785},
    {mes:"2026-11",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-11",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-12",fuente:"colegio",dia:1,monto:26203},
    {mes:"2026-12",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-12",fuente:"uveg",dia:30,monto:3500},
    {mes:"2027-01",fuente:"colegio",dia:1,monto:31443},
    {mes:"2027-01",fuente:"uveg",dia:15,monto:3500},
    {mes:"2027-01",fuente:"uveg",dia:30,monto:3500}
  ],
  pagos_fijos: [
    {concepto:"Carro",dia:1,monto:5000,sobre:null},
    {concepto:"Renta",dia:1,monto:2000,sobre:null},
    {concepto:"Gas",dia:1,monto:1500,sobre:null},
    {concepto:"Luz",dia:1,monto:200,sobre:null},
    {concepto:"SAT",dia:1,monto:2000,sobre:"sat"},
    {concepto:"Ahorro casa",dia:1,monto:1000,sobre:"ahorro_casa"},
    {concepto:"Open Bank",dia:1,monto:2000,sobre:"colchon"},
    {concepto:"PPR Allianz Optimaxx",dia:10,monto:2000,sobre:"programados"},
    {concepto:"Seguro Allianz",dia:14,monto:250,sobre:"programados"}
  ],
  suscripciones: [
    {concepto:"Smart Fit",dia:6,monto:599,bloque:"dia_1"},
    {concepto:"Claude Max",dia:11,monto:1725,bloque:"dia_1"},
    {concepto:"Bait",dia:18,monto:300,bloque:"dia_15"},
    {concepto:"Spotify",dia:18,monto:239,bloque:"dia_15"},
    {concepto:"Google One",dia:18,monto:199,bloque:"dia_15"},
    {concepto:"Baamboozle+",dia:19,monto:80,bloque:"dia_15"},
    {concepto:"Google CR",dia:20,monto:159,bloque:"dia_15"},
    {concepto:"Google One",dia:24,monto:17,bloque:"dia_15"},
    {concepto:"HBO Max",dia:27,monto:239,bloque:"dia_15"},
    {concepto:"Canva",dia:28,monto:210,bloque:"dia_15"}
  ],
  pagos_quincena: [{concepto:"El gasto de la casa (súper)",dia:15,monto:3000}],
  categorias: [
    {id:"gasolina",nombre:"Gasolina",emoji:"⛽️"},
    {id:"comida",nombre:"Comida",emoji:"🍽"},
    {id:"antojo",nombre:"Antojo",emoji:"🍩"},
    {id:"otro",nombre:"Otro",emoji:"•"}
  ]
};

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sep(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function mx(n){var g=n<0;var v=Math.abs(Math.round(n));return (g?"−$":"$")+sep(v)}
function ymd(d){var m=("0"+(d.getMonth()+1)).slice(-2),x=("0"+d.getDate()).slice(-2);
  return d.getFullYear()+"-"+m+"-"+x}
function mesKey(d){return ymd(d).slice(0,7)}
function deYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function nombreMes(mk){return MESES[+mk.slice(5,7)-1]+" "+mk.slice(0,4)}
function lunesDe(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x}
function proxLunes(d){var l=lunesDe(d);l.setDate(l.getDate()+7);return l}
function lunesDelMes(mk){var y=+mk.slice(0,4),m=+mk.slice(5,7),n=0,d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){if(d.getDay()===1)n++;d.setDate(d.getDate()+1)}return n}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}

/* ---------- datos ---------- */
var D = {movimientos:[], estado:{checklist:{},recibidos:{},cierres:{},ajustes:[]}};
var COLA = [];
var mesVista = mesKey(new Date());
var tabActual = "semana";

function cargarLocal(){
  try{
    var d=localStorage.getItem("dinero.datos"); if(d) D=JSON.parse(d);
    var c=localStorage.getItem("dinero.cola"); if(c) COLA=JSON.parse(c);
    // Una dirección guardada solo pisa a la de arriba si es válida.
    var e=localStorage.getItem("dinero.endpoint");
    if(e && e.indexOf("http")===0 && e.indexOf("/exec")>-1) ENDPOINT=e;
  }catch(err){}
  // Atajo: abrir la app con ?ep=<tu /exec> la deja conectada sin teclear nada.
  try{
    var qp = new URLSearchParams(location.search);
    var ep = qp.get("ep");
    if(ep){ ENDPOINT = ep; localStorage.setItem("dinero.endpoint", ENDPOINT) }
  }catch(err){}
  if(!D.estado) D.estado={};
  ["checklist","recibidos","cierres"].forEach(function(k){if(!D.estado[k])D.estado[k]={}});
  if(!D.estado.ajustes) D.estado.ajustes=[];
  if(!D.movimientos) D.movimientos=[];
}
function guardarLocal(){
  try{
    localStorage.setItem("dinero.datos",JSON.stringify(D));
    localStorage.setItem("dinero.cola",JSON.stringify(COLA));
  }catch(err){}
}
function encolar(op){
  if(op.a==="estado") COLA=COLA.filter(function(o){return o.a!=="estado"});
  COLA.push(op); guardarLocal(); pintarSync("pend"); sincronizar();
}
function encolarEstado(){ encolar({a:"estado",estado:D.estado}) }

/* ---------- sincronización ---------- */
var sincronizando=false;
function pintarSync(estado,texto){
  if(!ENDPOINT){
    $("#sync").className="";
    $("#syncTx").textContent="solo en este teléfono";
    return;
  }
  var el=$("#sync"); el.className=estado||"";
  $("#syncTx").textContent = texto || ({
    ok:"al día", pend:COLA.length+" por subir", err:"sin conexión", "":"local"
  })[estado||""];
}
function sincronizar(){
  if(!ENDPOINT || sincronizando) return;
  sincronizando=true;
  var cuerpo = COLA.length ? {a:"lote",ops:COLA.slice()} : {a:"get"};
  var enviadas = COLA.length;
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(cuerpo)})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j || !j.ok) throw new Error(j && j.error ? j.error : "respuesta rara");
    COLA = COLA.slice(enviadas);
    D.movimientos = j.movimientos || [];
    D.estado = j.estado || D.estado;
    ["checklist","recibidos","cierres"].forEach(function(k){if(!D.estado[k])D.estado[k]={}});
    if(!D.estado.ajustes) D.estado.ajustes=[];
    guardarLocal();
    pintarSync(COLA.length?"pend":"ok");
    pintar();
  })
  .catch(function(){ pintarSync(COLA.length?"pend":"err") })
  .then(function(){ sincronizando=false });
}

/* ---------- cálculos ---------- */
function depColegio(mk){var r=CFG.ingresos.filter(function(i){
  return i.mes===mk&&i.fuente==="colegio"})[0];return r?r.monto:0}
function ingresosDelMes(mk){return CFG.ingresos.filter(function(i){return i.mes===mk})
  .sort(function(a,b){return a.dia-b.dia})}
function idIng(i){return i.fuente+":"+i.dia}
function recibidoDe(mk,i){var r=D.estado.recibidos[mk];return r?(r[idIng(i)]||null):null}
function depColegioReal(mk){var r=(D.estado.recibidos[mk]||{})["colegio:1"];
  return (r&&r.monto)?r.monto:depColegio(mk)}
function satDelMes(mk){if(!CFG.sat_dinamico)return CFG.sat_fijo;
  var d=depColegioReal(mk);return d>0?Math.round(d*CFG.porcentaje_sat):CFG.sat_fijo}
function itemsDia1(mk){
  var sat=satDelMes(mk);
  var a=CFG.pagos_fijos.map(function(p){return {id:"f:"+p.concepto,concepto:p.concepto,
    dia:p.dia,monto:p.concepto==="SAT"?sat:p.monto,sobre:p.sobre}});
  var b=CFG.suscripciones.filter(function(s){return s.bloque==="dia_1"})
    .map(function(s){return {id:"s:"+s.concepto+":"+s.dia,concepto:s.concepto,
      dia:s.dia,monto:s.monto,sobre:null}});
  return a.concat(b).sort(function(x,y){return x.dia-y.dia})
}
function itemsDia15(){
  var a=CFG.pagos_quincena.map(function(p){return {id:"q:"+p.concepto,concepto:p.concepto,
    dia:p.dia,monto:p.monto,sobre:null}});
  var b=CFG.suscripciones.filter(function(s){return s.bloque==="dia_15"})
    .map(function(s){return {id:"s:"+s.concepto+":"+s.dia,concepto:s.concepto,
      dia:s.dia,monto:s.monto,sobre:null}});
  return a.concat(b).sort(function(x,y){return x.dia-y.dia})
}
function suma(a){return a.reduce(function(x,y){return x+y.monto},0)}
function movsSemana(ref){
  var i=lunesDe(ref||new Date()),f=new Date(i);f.setDate(f.getDate()+7);
  var a=ymd(i),b=ymd(f);
  return D.movimientos.filter(function(m){return m.fecha>=a&&m.fecha<b})
}
function saldoSemana(ref){
  var g=movsSemana(ref).reduce(function(a,b){return a+b.monto},0);
  return {asignado:CFG.monto_semanal,gastado:g,saldo:CFG.monto_semanal-g}
}
function colchonActual(){
  var t=0,k;
  for(k in D.estado.checklist) if(D.estado.checklist[k]["f:Open Bank"]) t+=2000;
  for(k in D.estado.cierres) t+=D.estado.cierres[k];
  D.estado.ajustes.forEach(function(a){t+=a.monto});
  return t
}
function sobranteMes(mk){
  var entra=ingresosDelMes(mk).reduce(function(a,i){
    var r=recibidoDe(mk,i);return a+(r?r.monto:i.monto)},0);
  return entra-suma(itemsDia1(mk))-suma(itemsDia15())-CFG.monto_semanal*lunesDelMes(mk)
}
function proyeccion(){
  var meses=[],hoy=mesKey(new Date()),acum=colchonActual(),fs=[];
  CFG.ingresos.forEach(function(i){if(meses.indexOf(i.mes)<0)meses.push(i.mes)});
  meses.sort();
  meses.forEach(function(mk){
    if(mk<hoy) return;
    if(D.estado.cierres[mk]!==undefined) return;
    var e=2000+sobranteMes(mk); acum+=e; fs.push({mes:mk,entra:e,acum:acum});
  });
  return fs
}
function clase(saldo){
  var p=saldo/CFG.monto_semanal;
  if(saldo<0||p<0.15) return "r";
  if(p<0.40) return "a";
  return "v"
}
function colorDe(c){return c==="v"?"var(--mint)":(c==="a"?"var(--brass)":"var(--coral)")}

/* ---------- acciones ---------- */
function agregarGasto(monto,cat){
  var m={id:uid(),fecha:ymd(new Date()),monto:Math.round(monto*100)/100,
         categoria:cat,es_efectivo:false,nota:""};
  D.movimientos.push(m); guardarLocal(); encolar({a:"add",mov:m}); pintar();
}
function borrarGasto(id){
  D.movimientos=D.movimientos.filter(function(m){return m.id!==id});
  guardarLocal(); encolar({a:"del",id:id}); pintar();
}
function togglePago(mk,id){
  if(!D.estado.checklist[mk]) D.estado.checklist[mk]={};
  if(D.estado.checklist[mk][id]) delete D.estado.checklist[mk][id];
  else D.estado.checklist[mk][id]=ymd(new Date());
  guardarLocal(); encolarEstado(); pintar();
}
function marcarIngreso(mk,ing){
  if(!D.estado.recibidos[mk]) D.estado.recibidos[mk]={};
  var k=idIng(ing), ya=D.estado.recibidos[mk][k];
  var v=prompt(ya?"Monto real de "+ing.fuente+" (vacío para desmarcar):"
                 :"¿Cuánto cayó de "+ing.fuente+"?", String(ya?ya.monto:ing.monto));
  if(v===null) return;
  v=String(v).replace(/[^0-9.]/g,"");
  if(v===""){ delete D.estado.recibidos[mk][k]; }
  else {
    var n=parseFloat(v); if(isNaN(n)||n<=0) return;
    D.estado.recibidos[mk][k]={monto:Math.round(n*100)/100, fecha: ya?ya.fecha:ymd(new Date())};
  }
  guardarLocal(); encolarEstado(); pintar();
}
function cerrarMes(mk){
  var ya=D.estado.cierres[mk];
  if(ya!==undefined){
    if(confirm("Este mes ya está cerrado con "+mx(ya)+". ¿Deshacer?")){
      delete D.estado.cierres[mk]; guardarLocal(); encolarEstado(); pintar();
    }
    return;
  }
  var sug=Math.round(sobranteMes(mk));
  var v=prompt("Lo que quede sin gastar se suma al colchón.\nSugerido: "+mx(sug),String(sug));
  if(v===null) return;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  if(isNaN(n)) return;
  D.estado.cierres[mk]=Math.round(n); guardarLocal(); encolarEstado(); pintar();
}
function ajusteColchon(){
  var v=prompt("Ajuste al colchón (negativo resta):","");
  if(v===null) return;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  if(isNaN(n)||n===0) return;
  var nota=prompt("Nota (opcional):","")||"";
  D.estado.ajustes.push({fecha:ymd(new Date()),monto:Math.round(n),nota:nota});
  guardarLocal(); encolarEstado(); pintar();
}

/* ---------- pintado ---------- */
function pintar(){
  pintarSemana(); pintarMes(); pintarSobres();
  // Si estás escribiendo la dirección, no le vuelvo a dibujar encima.
  var act = document.activeElement;
  if(!(act && act.id === "ep")) pintarColchon();
}

/* ---------- conectar con la hoja ---------- */
function decir(txt, color){
  var m = $("#epmsg");
  if(!m) return;
  m.textContent = txt;
  m.style.color = color || "var(--dim-2)";
}

function conectar(){
  var campo = $("#ep");
  var v = campo ? String(campo.value || "").trim() : "";
  if(!v){ decir("Pega primero la dirección. Es la que termina en /exec.","var(--coral)"); return }
  if(v.indexOf("http") !== 0){
    decir("Eso no parece una dirección. Debe empezar con https://","var(--coral)"); return }
  if(v.indexOf("/exec") < 0){
    decir("Esa dirección no termina en /exec. La buena sale de Implementar → Administrar implementaciones.","var(--coral)"); return }

  ENDPOINT = v;
  try{ localStorage.setItem("dinero.endpoint", ENDPOINT) }catch(e){}
  decir("Conectando…","var(--dim)");
  pintarSync("pend");

  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({a:"get"})})
  .then(function(r){
    if(!r.ok) throw new Error("la hoja contestó "+r.status);
    return r.json();
  })
  .then(function(j){
    if(!j || !j.ok) throw new Error((j && j.error) ? j.error : "respuesta inesperada");
    D.movimientos = j.movimientos || [];
    D.estado = j.estado || D.estado;
    ["checklist","recibidos","cierres"].forEach(function(k){if(!D.estado[k])D.estado[k]={}});
    if(!D.estado.ajustes) D.estado.ajustes=[];
    guardarLocal();
    pintarSync("ok");
    decir("Conectado ✓ · "+D.movimientos.length+" movimiento(s) en la hoja","var(--mint)");
    pintarSemana(); pintarMes(); pintarSobres();
  })
  .catch(function(e){
    pintarSync("err");
    decir("No pude conectar: "+e.message+". Revisa que al implementar hayas puesto «Cualquier usuario».","var(--coral)");
  });
}

function pintarSemana(){
  var s=saldoSemana(), c=clase(s.saldo), l=proxLunes(new Date());
  var pct=Math.max(0,Math.min(1,Math.max(0,s.saldo)/CFG.monto_semanal));
  var h='<div class="hero">'+
    '<div class="cifra '+c+'">'+mx(Math.abs(s.saldo))+'</div>'+
    '<div class="pie">'+(s.saldo<0?"te pasaste por esto":"te quedan esta semana")+'</div>'+
    '<div class="barra"><i style="width:'+(pct*100).toFixed(1)+'%;background:'+colorDe(c)+'"></i></div>'+
    '<div class="reinicio">se reinicia el lunes '+l.getDate()+' de '+MESES[l.getMonth()]+'</div>'+
    '</div>';

  var ms=movsSemana().slice().sort(function(a,b){return b.id<a.id?-1:1});
  h+='<div class="rotulo"><span>Esta semana</span><span>gastado '+mx(s.gastado)+' de '+mx(CFG.monto_semanal)+'</span></div>';
  if(!ms.length) h+='<div class="lista"><div class="vacio">Semana limpia. Nada capturado todavía.</div></div>';
  else{
    h+='<div class="lista">';
    ms.forEach(function(m){
      var ct=CFG.categorias.filter(function(x){return x.id===m.categoria})[0];
      h+='<button class="row" type="button" data-borrar="'+esc(m.id)+'">'+
         '<span class="ic">'+(ct?ct.emoji:"•")+'</span>'+
         '<span class="tx"><b>'+esc(ct?ct.nombre:m.categoria)+'</b><small>'+esc(m.fecha)+
         (m.nota?" · "+esc(m.nota):"")+'</small></span>'+
         '<span class="mt neg">'+mx(m.monto)+'</span></button>';
    });
    h+='</div><div class="nota">Toca un gasto para borrarlo.</div>';
  }
  $("#t-semana").innerHTML=h;
}

function pintarMes(){
  var mk=mesVista;
  var marcas=D.estado.checklist[mk]||{};
  var ings=ingresosDelMes(mk);
  var pagos=itemsDia1(mk).concat(itemsDia15());
  var movs=D.movimientos.filter(function(m){return m.fecha.slice(0,7)===mk});

  var entro=ings.reduce(function(a,i){var r=recibidoDe(mk,i);return a+(r?r.monto:0)},0);
  var planeado=ings.reduce(function(a,i){return a+i.monto},0);
  var pagado=pagos.filter(function(p){return marcas[p.id]})
    .reduce(function(a,b){return a+b.monto},0);
  var gastado=movs.reduce(function(a,b){return a+b.monto},0);
  var queda=entro-pagado-gastado;

  var h='<div class="mesnav"><h2>'+nombreMes(mk)+'</h2>'+
    '<button type="button" data-mes="-1">◀︎</button>'+
    '<button type="button" data-mes="1">▶︎</button></div>'+
    '<div class="trio">'+
    '<div class="tile"><b style="color:var(--mint)">'+mx(entro)+'</b><small>entró</small></div>'+
    '<div class="tile"><b>'+mx(pagado+gastado)+'</b><small>salió</small></div>'+
    '<div class="tile"><b style="color:'+(queda<0?"var(--coral)":"var(--text)")+'">'+mx(queda)+'</b><small>queda</small></div>'+
    '</div>'+
    '<div class="nota">Falta por caer '+mx(planeado-entro)+' · falta por pagar '+
      mx(suma(pagos)-pagado)+' · gastos '+mx(gastado)+'</div>';

  if(!ings.length){
    h+='<div class="nota" style="color:var(--brass);margin-top:10px">'+
       'Este mes no está en el calendario de ingresos: arranca en octubre 2026. '+
       'Los gastos sí se registran igual.</div>';
  }

  var ya=[],falta=[];
  ings.forEach(function(i){
    var r=recibidoDe(mk,i);
    var it={tipo:"ingreso",ic:r?"💰":"⬜️",tit:i.fuente==="colegio"?"Colegio":"UVEG",
      dia:i.dia,monto:r?r.monto:i.monto,hecho:!!r,
      sub:"día "+i.dia+(r?" · registrado el "+r.fecha:""),ref:idIng(i)};
    (r?ya:falta).push(it);
  });
  pagos.forEach(function(p){
    var m=marcas[p.id];
    var it={tipo:"pago",ic:m?"✅":"⬜️",tit:p.concepto,dia:p.dia,monto:p.monto,hecho:!!m,
      sub:"día "+p.dia+(p.sobre?" · sobre "+p.sobre:"")+(typeof m==="string"?" · pagado el "+m:""),
      ref:p.id};
    (m?ya:falta).push(it);
  });
  movs.forEach(function(m){
    var ct=CFG.categorias.filter(function(x){return x.id===m.categoria})[0];
    ya.push({tipo:"gasto",ic:ct?ct.emoji:"•",tit:ct?ct.nombre:m.categoria,
      dia:+m.fecha.slice(8,10),monto:m.monto,hecho:true,
      sub:m.fecha+(m.nota?" · "+m.nota:""),ref:m.id});
  });
  ya.sort(function(a,b){return b.dia-a.dia});
  falta.sort(function(a,b){return a.dia-b.dia});

  function bloque(titulo,arr,vacio){
    var s='<div class="rotulo"><span>'+titulo+'</span><span>'+arr.length+'</span></div>';
    if(!arr.length) return s+'<div class="lista"><div class="vacio">'+vacio+'</div></div>';
    s+='<div class="lista">';
    arr.forEach(function(it){
      var pos=it.tipo==="ingreso";
      s+='<button class="row'+(it.hecho&&it.tipo==="pago"?" hecho":"")+'" type="button" '+
         'data-tipo="'+it.tipo+'" data-ref="'+esc(it.ref)+'">'+
         '<span class="ic">'+it.ic+'</span>'+
         '<span class="tx"><b>'+esc(it.tit)+'</b><small>'+esc(it.sub)+'</small></span>'+
         '<span class="mt '+(pos?"pos":"neg")+'">'+(pos?"+":"−")+mx(it.monto)+'</span></button>';
    });
    return s+'</div>';
  }
  h+=bloque("Ya pasó",ya,"Nada todavía en "+nombreMes(mk));
  h+=bloque("Falta",falta,"Mes completo 🎉");

  var cerrado=D.estado.cierres[mk];
  h+='<button class="btn '+(cerrado!==undefined?"gris":"")+'" type="button" data-cerrar="1">'+
     (cerrado!==undefined?"Mes cerrado · "+mx(cerrado)+" al colchón":"Cerrar el mes y barrer al colchón")+
     '</button>';
  h+='<div class="nota">SAT de '+nombreMes(mk)+': '+mx(satDelMes(mk))+
     ' — 8% de '+mx(depColegioReal(mk))+'</div>';

  $("#t-mes").innerHTML=h;
}

function pintarSobres(){
  var mk=mesKey(new Date()), marcas=D.estado.checklist[mk]||{}, s=saldoSemana();
  var prog=CFG.pagos_fijos.filter(function(p){return p.sobre==="programados"})
    .reduce(function(a,b){return a+b.monto},0);
  var progHecho=(marcas["f:PPR Allianz Optimaxx"]?2000:0)+(marcas["f:Seguro Allianz"]?250:0);
  var sat=satDelMes(mk);
  var lista=[
    {n:"Mis semanas",b:"gastos de gustos",d:s.saldo,t:s.asignado},
    {n:"SAT",b:"ni te atrevas",d:marcas["f:SAT"]?0:sat,t:sat},
    {n:"Ahorro casa",b:"Ahorro",d:marcas["f:Ahorro casa"]?0:1000,t:1000},
    {n:"Pagos programados",b:"gastos",d:prog-progHecho,t:prog},
    {n:"Colchón",b:"Open Bank",d:colchonActual(),t:CFG.meta_colchon}
  ];
  var h='<div class="rotulo"><span>Sobres · '+nombreMes(mk)+'</span><span>solo lectura</span></div><div class="lista">';
  lista.forEach(function(x){
    h+='<div class="row"><span class="ic">✉</span>'+
       '<span class="tx"><b>'+esc(x.n)+'</b><small>BBVA · '+esc(x.b)+'</small></span>'+
       '<span class="mt '+(x.d<0?"mal":"neg")+'">'+mx(x.d)+'</span></div>';
  });
  h+='</div><div class="nota">Espejo de tus apartados. El disponible sale de lo que ya palomeaste en Mes.</div>';
  $("#t-sobres").innerHTML=h;
}

function pintarColchon(){
  var a=colchonActual(), falta=Math.max(0,CFG.meta_colchon-a);
  var pct=Math.max(0,Math.min(1,a/CFG.meta_colchon));
  var h='<div class="hero">'+
    '<div class="cifra v">'+mx(a)+'</div>'+
    '<div class="pie">'+(falta>0?"faltan "+mx(falta)+" para los "+mx(CFG.meta_colchon):"meta alcanzada 🎉")+'</div>'+
    '<div class="barra"><i style="width:'+(pct*100).toFixed(1)+'%;background:var(--mint)"></i></div>'+
    '</div>';
  var p=proyeccion();
  h+='<div class="rotulo"><span>Proyección</span><span>acumulado</span></div><div class="lista">';
  if(!p.length) h+='<div class="vacio">Sin meses por delante en el calendario.</div>';
  p.forEach(function(f){
    var exc=depColegio(f.mes)-CFG.meta_colchon;
    var etiqueta = exc>0 ? "mes alto, sobran "+mx(exc)
                 : (lunesDelMes(f.mes)===5 ? "5 lunes" : "");
    h+='<div class="row"><span class="ic">▲</span>'+
       '<span class="tx"><b>'+nombreMes(f.mes).split(" ")[0]+'</b><small>'+
       (etiqueta?etiqueta+' · ':'')+'entra '+mx(f.entra)+'</small></span>'+
       '<span class="mt '+(f.acum>=CFG.meta_colchon?"pos":"neg")+'">'+mx(f.acum)+'</span></div>';
  });
  h+='</div>';
  h+='<button class="btn gris" type="button" data-ajuste="1">＋ Ajuste manual al colchón</button>';
  if(D.estado.ajustes.length){
    h+='<div class="rotulo"><span>Ajustes</span><span>'+D.estado.ajustes.length+'</span></div><div class="lista">';
    D.estado.ajustes.slice().reverse().forEach(function(x){
      h+='<div class="row"><span class="ic">•</span>'+
         '<span class="tx"><b>'+esc(x.nota||"ajuste manual")+'</b><small>'+esc(x.fecha)+'</small></span>'+
         '<span class="mt '+(x.monto>0?"pos":"mal")+'">'+(x.monto>0?"+":"")+mx(x.monto)+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="rotulo"><span>Ajustes de la app</span><span></span></div>'+
     '<div class="campo"><label>Dirección de tu hoja de Google</label>'+
     '<input id="ep" type="url" inputmode="url" autocapitalize="off" autocorrect="off" '+
     'spellcheck="false" placeholder="https://script.google.com/…/exec" value="'+esc(ENDPOINT)+'"></div>'+
     '<button class="btn" type="button" data-guardarep="1">Guardar y sincronizar</button>'+
     '<div class="nota" id="epmsg">Sin dirección, la app funciona igual pero solo en este teléfono.</div>';
  $("#t-colchon").innerHTML=h;
}

/* ---------- teclado ---------- */
var buffer="0";
function abrirPad(){
  buffer="0"; pintarPad();
  var s=saldoSemana();
  $("#padPie").textContent = s.saldo>=0
    ? "te quedan "+mx(s.saldo)+" esta semana"
    : "vas "+mx(Math.abs(s.saldo))+" pasado";
  $("#velo").classList.add("on"); $("#pad").classList.add("on");
}
function cerrarPad(){ $("#velo").classList.remove("on"); $("#pad").classList.remove("on") }
function pintarPad(){
  var el=$("#monto");
  el.textContent = "$"+(buffer==="0"?"0":sep(buffer.split(".")[0])+(buffer.indexOf(".")>=0?"."+buffer.split(".")[1]:""));
  el.className = "mono"+(buffer==="0"?" cero":"");
}
function tecla(t){
  if(t==="⌫"){ buffer=buffer.length>1?buffer.slice(0,-1):"0"; }
  else if(t==="."){ if(buffer.indexOf(".")<0) buffer+="."; }
  else { if(buffer==="0") buffer=t; else if(buffer.replace(".","").length<7) buffer+=t; }
  pintarPad();
}

/* ---------- arranque ---------- */
function montarTeclado(){
  var tl=["1","2","3","4","5","6","7","8","9",".","0","⌫"], h="";
  tl.forEach(function(t){h+='<button type="button" data-k="'+t+'">'+t+'</button>'});
  $("#teclas").innerHTML=h;
  h="";
  CFG.categorias.forEach(function(c){
    h+='<button type="button" data-c="'+c.id+'"><span class="ce">'+c.emoji+'</span>'+c.nombre+'</button>';
  });
  $("#cats").innerHTML=h;
}

function irA(t){
  tabActual=t;
  document.querySelectorAll(".tab").forEach(function(s){s.classList.remove("on")});
  $("#t-"+t).classList.add("on");
  document.querySelectorAll("nav button").forEach(function(b){
    b.classList.toggle("on", b.dataset.t===t)});
  $("#titulo").textContent={semana:"Esta semana",mes:"Este mes",
    sobres:"Sobres",colchon:"Colchón"}[t];
  document.querySelector("main").scrollTop=0;
}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b) return;

  if(b.dataset.t){ irA(b.dataset.t); return }
  if(b.id==="fab"){ abrirPad(); return }
  if(b.id==="padCerrar"){ cerrarPad(); return }
  if(b.id==="sync"){ sincronizar(); return }
  if(b.dataset.k!==undefined){ tecla(b.dataset.k); return }
  if(b.dataset.c){
    var n=parseFloat(buffer);
    if(!n||isNaN(n)||n<=0){ cerrarPad(); return }
    agregarGasto(n,b.dataset.c); cerrarPad(); return;
  }
  if(b.dataset.borrar){
    if(confirm("¿Borrar este gasto?")) borrarGasto(b.dataset.borrar);
    return;
  }
  if(b.dataset.mes){
    var d=deYmd(mesVista+"-01"); d.setMonth(d.getMonth()+ +b.dataset.mes);
    mesVista=mesKey(d); pintarMes(); return;
  }
  if(b.dataset.tipo==="pago"){ togglePago(mesVista,b.dataset.ref); return }
  if(b.dataset.tipo==="ingreso"){
    var ing=ingresosDelMes(mesVista).filter(function(i){return idIng(i)===b.dataset.ref})[0];
    if(ing) marcarIngreso(mesVista,ing);
    return;
  }
  if(b.dataset.tipo==="gasto"){
    if(confirm("¿Borrar este gasto?")) borrarGasto(b.dataset.ref);
    return;
  }
  if(b.dataset.cerrar){ cerrarMes(mesVista); return }
  if(b.dataset.ajuste){ ajusteColchon(); return }
  if(b.dataset.guardarep){ conectar(); return }
});
$("#velo").addEventListener("click",cerrarPad);

cargarLocal();
montarTeclado();
pintar();
pintarSync(ENDPOINT?(COLA.length?"pend":"ok"):"");
sincronizar();
setInterval(sincronizar, 60000);
window.addEventListener("online", sincronizar);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){ pintar(); sincronizar() }
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>

<style>
/* ============ 1. IDENTIDAD ============ */
:root{
  --ink:#0E1116;
  --surf:#161B22;
  --surf-2:#1D2430;
  --line:#242C39;
  --text:#F0F3F8;
  --dim:#8A94A6;
  --dim-2:#5E6878;
  --mint:#4ADE9B;
  --brass:#D9A441;
  --coral:#F2706B;
  --r:14px;
  --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Archivo",sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}

/* ============ 2. ARMAZÓN ============ */
#app{display:flex;flex-direction:column;height:100%}
header{
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  background:var(--ink);position:relative;z-index:5
}
header h1{font-size:19px;flex:1}
#sync{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--dim-2);display:flex;align-items:center;gap:6px;text-align:right
}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
#sync.ok .dot{background:var(--mint)}
#sync.pend .dot{background:var(--brass)}
#sync.err .dot{background:var(--coral)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(var(--tab-h) + var(--safe-b) + 92px)}
.tab{display:none}
.tab.on{display:block}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(14,17,22,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:0 6px calc(var(--safe-b));
  display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tab-h) + var(--safe-b))
}
nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--dim-2);font-weight:500;height:var(--tab-h)
}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--text)}
nav button.on .ic{filter:none}

#fab{
  position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:21;
  width:60px;height:60px;border-radius:30px;background:var(--mint);color:#08130D;
  font-size:30px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 28px -8px rgba(74,222,155,.55)
}
#fab:active{transform:scale(.94)}

/* ============ 3. PIEZAS ============ */
.hero{padding:34px 0 6px;text-align:center}
.hero .cifra{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(52px,17vw,72px);
  line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.hero .cifra.v{color:var(--mint)} .hero .cifra.a{color:var(--brass)} .hero .cifra.r{color:var(--coral)}
.hero .pie{color:var(--dim);font-size:14.5px;margin-top:8px}
.barra{height:9px;border-radius:5px;background:var(--surf-2);overflow:hidden;margin:20px 0 9px}
.barra i{display:block;height:100%;border-radius:5px;transition:width .35s ease}
.reinicio{font-size:12px;color:var(--dim-2);text-align:center}

.rotulo{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim-2);font-weight:600;
  margin:30px 0 10px;display:flex;justify-content:space-between;align-items:center
}
.rotulo span:last-child{letter-spacing:.04em}

.lista{background:var(--surf);border-radius:var(--r);overflow:hidden}
.row{
  display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;
  padding:13px 15px;border-top:1px solid var(--line);width:100%;text-align:left
}
.lista .row:first-child{border-top:none}
.row .ic{font-size:16px;text-align:center}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--dim-2);font-size:11.5px;margin-top:1px}
.row .mt{font-weight:600;font-size:15px;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.row.hecho .tx b,.row.hecho .mt{color:var(--dim-2)}
.mt.pos{color:var(--mint)} .mt.neg{color:var(--text)} .mt.mal{color:var(--coral)}
.row:active{background:var(--surf-2)}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.tile{background:var(--surf);border-radius:var(--r);padding:14px 10px;text-align:center}
.tile b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.tile small{display:block;color:var(--dim-2);font-size:11px;margin-top:3px}
.nota{color:var(--dim-2);font-size:12.5px;text-align:center;margin-top:12px}

.mesnav{display:flex;align-items:center;gap:10px;margin-top:22px}
.mesnav h2{flex:1;font-size:20px}
.mesnav button{
  width:38px;height:38px;border-radius:12px;background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)
}

.vacio{padding:26px 16px;text-align:center;color:var(--dim-2);font-size:14px}

/* ============ 4. TECLADO ============ */
#velo{
  position:fixed;inset:0;background:rgba(6,8,11,.72);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
#velo.on{opacity:1;pointer-events:auto}
#pad{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--surf);border-radius:22px 22px 0 0;
  padding:16px 16px calc(16px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -14px 40px -12px rgba(0,0,0,.7)
}
#pad.on{transform:translateY(0)}
#pad .cab{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
#pad .cab small{color:var(--dim-2);font-size:12.5px;flex:1}
#monto{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:44px;line-height:1.1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-height:52px
}
#monto.cero{color:var(--dim-2)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.teclas button{
  background:var(--surf-2);border-radius:12px;height:54px;
  font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500
}
.teclas button:active{background:#2A3441}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{
  background:var(--surf-2);border-radius:12px;padding:11px 4px;font-size:11.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.2
}
.cats button .ce{font-size:19px}
.cats button:active{background:var(--mint);color:#08130D}
#pad .cerrar{display:block;width:100%;text-align:center;color:var(--dim-2);font-size:14px;padding:14px 0 2px}

/* ============ 5. AJUSTES ============ */
.campo{background:var(--surf);border-radius:var(--r);padding:15px;margin-top:10px}
.campo label{display:block;font-size:12px;color:var(--dim-2);margin-bottom:7px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.campo input{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:13px
}
.campo input:focus{outline:none;border-color:var(--mint)}
.btn{
  display:block;width:100%;background:var(--mint);color:#08130D;border-radius:12px;
  padding:15px;text-align:center;font-weight:600;font-size:16px;margin-top:12px;
  font-family:"Archivo",sans-serif
}
.btn.gris{background:var(--surf-2);color:var(--text)}
.btn:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>

<div id="app">
  <header>
    <h1 id="titulo">Esta semana</h1>
    <button id="sync" class="" type="button"><span class="dot"></span><span id="syncTx">—</span></button>
  </header>

  <main>
    <section class="tab on" id="t-semana"></section>

</div>

<div id="velo"></div>
<div id="pad">

  <button class="cerrar" id="padCerrar" type="button">Cancelar</button>
</div>

<script>
/* =====================================================================
   DINERO — app web
   Los datos viven en tu hoja de Google y en este teléfono.
   Pega tu dirección en ENDPOINT o ponla desde Colchón → Ajustes.
   ===================================================================== */
var ENDPOINT = "";   // ← pega aquí la URL /exec de tu Apps Script

/* ---------- configuración del sistema ---------- */
var CFG = {
  monto_semanal: 2300,
  meta_colchon: 30000,
  porcentaje_sat: 0.08,
  sat_dinamico: true,
  sat_fijo: 2000,
  ingresos: [
    {mes:"2026-10",fuente:"colegio",dia:1,monto:26203},
    {mes:"2026-10",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-10",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-11",fuente:"colegio",dia:1,monto:49785},
    {mes:"2026-11",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-11",fuente:"uveg",dia:30,monto:3500},
    {mes:"2026-12",fuente:"colegio",dia:1,monto:26203},
    {mes:"2026-12",fuente:"uveg",dia:15,monto:3500},
    {mes:"2026-12",fuente:"uveg",dia:30,monto:3500},
    {mes:"2027-01",fuente:"colegio",dia:1,monto:31443},
    {mes:"2027-01",fuente:"uveg",dia:15,monto:3500},
    {mes:"2027-01",fuente:"uveg",dia:30,monto:3500}
  ],
  pagos_fijos: [
    {concepto:"Carro",dia:1,monto:5000,sobre:null},
    {concepto:"Renta",dia:1,monto:2000,sobre:null},
    {concepto:"Gas",dia:1,monto:1500,sobre:null},
    {concepto:"Luz",dia:1,monto:200,sobre:null},
    {concepto:"SAT",dia:1,monto:2000,sobre:"sat"},
    {concepto:"Ahorro casa",dia:1,monto:1000,sobre:"ahorro_casa"},
    {concepto:"Open Bank",dia:1,monto:2000,sobre:"colchon"},
    {concepto:"PPR Allianz Optimaxx",dia:10,monto:2000,sobre:"programados"},
    {concepto:"Seguro Allianz",dia:14,monto:250,sobre:"programados"}
  ],
  suscripciones: [
    {concepto:"Smart Fit",dia:6,monto:599,bloque:"dia_1"},
    {concepto:"Claude Max",dia:11,monto:1725,bloque:"dia_1"},
    {concepto:"Bait",dia:18,monto:300,bloque:"dia_15"},
    {concepto:"Spotify",dia:18,monto:239,bloque:"dia_15"},
    {concepto:"Google One",dia:18,monto:199,bloque:"dia_15"},
    {concepto:"Baamboozle+",dia:19,monto:80,bloque:"dia_15"},
    {concepto:"Google CR",dia:20,monto:159,bloque:"dia_15"},
    {concepto:"Google One",dia:24,monto:17,bloque:"dia_15"},
    {concepto:"HBO Max",dia:27,monto:239,bloque:"dia_15"},
    {concepto:"Canva",dia:28,monto:210,bloque:"dia_15"}
  ],
  pagos_quincena: [{concepto:"El gasto de la casa (súper)",dia:15,monto:3000}],
  categorias: [
    {id:"gasolina",nombre:"Gasolina",emoji:"⛽️"},
    {id:"comida",nombre:"Comida",emoji:"🍽"},
    {id:"antojo",nombre:"Antojo",emoji:"🍩"},
    {id:"otro",nombre:"Otro",emoji:"•"}
  ]
};

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sep(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function mx(n){var g=n<0;var v=Math.abs(Math.round(n));return (g?"−$":"$")+sep(v)}
function ymd(d){var m=("0"+(d.getMonth()+1)).slice(-2),x=("0"+d.getDate()).slice(-2);
  return d.getFullYear()+"-"+m+"-"+x}
function mesKey(d){return ymd(d).slice(0,7)}
function deYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function nombreMes(mk){return MESES[+mk.slice(5,7)-1]+" "+mk.slice(0,4)}
function lunesDe(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x}
function proxLunes(d){var l=lunesDe(d);l.setDate(l.getDate()+7);return l}
function lunesDelMes(mk){var y=+mk.slice(0,4),m=+mk.slice(5,7),n=0,d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){if(d.getDay()===1)n++;d.setDate(d.getDate()+1)}return n}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}

/* ---------- datos ---------- */
var D = {movimientos:[], estado:{checklist:{},recibidos:{},cierres:{},ajustes:[]}};
var COLA = [];
var mesVista = mesKey(new Date());
var tabActual = "semana";

function cargarLocal(){
  try{
    var d=localStorage.getItem("dinero.datos"); if(d) D=JSON.parse(d);
    var c=localStorage.getItem("dinero.cola"); if(c) COLA=JSON.parse(c);
    var e=localStorage.getItem("dinero.endpoint"); if(e) ENDPOINT=e;
  }catch(err){}
  if(!D.estado) D.estado={};
  ["checklist","recibidos","cierres"].forEach(function(k){if(!D.estado[k])D.estado[k]={}});
  if(!D.estado.ajustes) D.estado.ajustes=[];
  if(!D.movimientos) D.movimientos=[];
}
function guardarLocal(){
  try{
    localStorage.setItem("dinero.datos",JSON.stringify(D));
    localStorage.setItem("dinero.cola",JSON.stringify(COLA));
  }catch(err){}
}
function encolar(op){
  if(op.a==="estado") COLA=COLA.filter(function(o){return o.a!=="estado"});
  COLA.push(op); guardarLocal(); pintarSync("pend"); sincronizar();
}
function encolarEstado(){ encolar({a:"estado",estado:D.estado}) }

/* ---------- sincronización ---------- */
var sincronizando=false;
function pintarSync(estado,texto){
  if(!ENDPOINT){
    $("#sync").className="";
    $("#syncTx").textContent="solo en este teléfono";
    return;
  }
  var el=$("#sync"); el.className=estado||"";
  $("#syncTx").textContent = texto || ({
    ok:"al día", pend:COLA.length+" por subir", err:"sin conexión", "":"local"
  })[estado||""];
}
function sincronizar(){
  if(!ENDPOINT || sincronizando) return;
  sincronizando=true;
  var cuerpo = COLA.length ? {a:"lote",ops:COLA.slice()} : {a:"get"};
  var enviadas = COLA.length;
  fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(cuerpo)})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j || !j.ok) throw new Error(j && j.error ? j.error : "respuesta rara");
    COLA = COLA.slice(enviadas);
    D.movimientos = j.movimientos || [];
    D.estado = j.estado || D.estado;
    ["checklist","recibidos","cierres"].forEach(function(k){if(!D.estado[k])D.estado[k]={}});
    if(!D.estado.ajustes) D.estado.ajustes=[];
    guardarLocal();
    pintarSync(COLA.length?"pend":"ok");
    pintar();
  })
  .catch(function(){ pintarSync(COLA.length?"pend":"err") })
  .then(function(){ sincronizando=false });
}

/* ---------- cálculos ---------- */
function depColegio(mk){var r=CFG.ingresos.filter(function(i){
  return i.mes===mk&&i.fuente==="colegio"})[0];return r?r.monto:0}
function ingresosDelMes(mk){return CFG.ingresos.filter(function(i){return i.mes===mk})
  .sort(function(a,b){return a.dia-b.dia})}
function idIng(i){return i.fuente+":"+i.dia}
function recibidoDe(mk,i){var r=D.estado.recibidos[mk];return r?(r[idIng(i)]||null):null}
function depColegioReal(mk){var r=(D.estado.recibidos[mk]||{})["colegio:1"];
  return (r&&r.monto)?r.monto:depColegio(mk)}
function satDelMes(mk){if(!CFG.sat_dinamico)return CFG.sat_fijo;
  var d=depColegioReal(mk);return d>0?Math.round(d*CFG.porcentaje_sat):CFG.sat_fijo}
function itemsDia1(mk){
  var sat=satDelMes(mk);
  var a=CFG.pagos_fijos.map(function(p){return {id:"f:"+p.concepto,concepto:p.concepto,
    dia:p.dia,monto:p.concepto==="SAT"?sat:p.monto,sobre:p.sobre}});
  var b=CFG.suscripciones.filter(function(s){return s.bloque==="dia_1"})
    .map(function(s){return {id:"s:"+s.concepto+":"+s.dia,concepto:s.concepto,
      dia:s.dia,monto:s.monto,sobre:null}});
  return a.concat(b).sort(function(x,y){return x.dia-y.dia})
}
function itemsDia15(){
  var a=CFG.pagos_quincena.map(function(p){return {id:"q:"+p.concepto,concepto:p.concepto,
    dia:p.dia,monto:p.monto,sobre:null}});
  var b=CFG.suscripciones.filter(function(s){return s.bloque==="dia_15"})
    .map(function(s){return {id:"s:"+s.concepto+":"+s.dia,concepto:s.concepto,
      dia:s.dia,monto:s.monto,sobre:null}});
  return a.concat(b).sort(function(x,y){return x.dia-y.dia})
}
function suma(a){return a.reduce(function(x,y){return x+y.monto},0)}
function movsSemana(ref){
  var i=lunesDe(ref||new Date()),f=new Date(i);f.setDate(f.getDate()+7);
  var a=ymd(i),b=ymd(f);
  return D.movimientos.filter(function(m){return m.fecha>=a&&m.fecha<b})
}
function saldoSemana(ref){
  var g=movsSemana(ref).reduce(function(a,b){return a+b.monto},0);
  return {asignado:CFG.monto_semanal,gastado:g,saldo:CFG.monto_semanal-g}
}
function colchonActual(){
  var t=0,k;
  for(k in D.estado.checklist) if(D.estado.checklist[k]["f:Open Bank"]) t+=2000;
  for(k in D.estado.cierres) t+=D.estado.cierres[k];
  D.estado.ajustes.forEach(function(a){t+=a.monto});
  return t
}
function sobranteMes(mk){
  var entra=ingresosDelMes(mk).reduce(function(a,i){
    var r=recibidoDe(mk,i);return a+(r?r.monto:i.monto)},0);
  return entra-suma(itemsDia1(mk))-suma(itemsDia15())-CFG.monto_semanal*lunesDelMes(mk)
}
function proyeccion(){
  var meses=[],hoy=mesKey(new Date()),acum=colchonActual(),fs=[];
  CFG.ingresos.forEach(function(i){if(meses.indexOf(i.mes)<0)meses.push(i.mes)});
  meses.sort();
  meses.forEach(function(mk){
    if(mk<hoy) return;
    if(D.estado.cierres[mk]!==undefined) return;
    var e=2000+sobranteMes(mk); acum+=e; fs.push({mes:mk,entra:e,acum:acum});
  });
  return fs
}
function clase(saldo){
  var p=saldo/CFG.monto_semanal;
  if(saldo<0||p<0.15) return "r";
  if(p<0.40) return "a";
  return "v"
}
function colorDe(c){return c==="v"?"var(--mint)":(c==="a"?"var(--brass)":"var(--coral)")}

/* ---------- acciones ---------- */
function agregarGasto(monto,cat){
  var m={id:uid(),fecha:ymd(new Date()),monto:Math.round(monto*100)/100,
         categoria:cat,es_efectivo:false,nota:""};
  D.movimientos.push(m); guardarLocal(); encolar({a:"add",mov:m}); pintar();
}
function borrarGasto(id){
  D.movimientos=D.movimientos.filter(function(m){return m.id!==id});
  guardarLocal(); encolar({a:"del",id:id}); pintar();
}
function togglePago(mk,id){
  if(!D.estado.checklist[mk]) D.estado.checklist[mk]={};
  if(D.estado.checklist[mk][id]) delete D.estado.checklist[mk][id];
  else D.estado.checklist[mk][id]=ymd(new Date());
  guardarLocal(); encolarEstado(); pintar();
}
function marcarIngreso(mk,ing){
  if(!D.estado.recibidos[mk]) D.estado.recibidos[mk]={};
  var k=idIng(ing), ya=D.estado.recibidos[mk][k];
  var v=prompt(ya?"Monto real de "+ing.fuente+" (vacío para desmarcar):"
                 :"¿Cuánto cayó de "+ing.fuente+"?", String(ya?ya.monto:ing.monto));
  if(v===null) return;
  v=String(v).replace(/[^0-9.]/g,"");
  if(v===""){ delete D.estado.recibidos[mk][k]; }
  else {
    var n=parseFloat(v); if(isNaN(n)||n<=0) return;
    D.estado.recibidos[mk][k]={monto:Math.round(n*100)/100, fecha: ya?ya.fecha:ymd(new Date())};
  }
  guardarLocal(); encolarEstado(); pintar();
}
function cerrarMes(mk){
  var ya=D.estado.cierres[mk];
  if(ya!==undefined){
    if(confirm("Este mes ya está cerrado con "+mx(ya)+". ¿Deshacer?")){
      delete D.estado.cierres[mk]; guardarLocal(); encolarEstado(); pintar();
    }
    return;
  }
  var sug=Math.round(sobranteMes(mk));
  var v=prompt("Lo que quede sin gastar se suma al colchón.\nSugerido: "+mx(sug),String(sug));
  if(v===null) return;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  if(isNaN(n)) return;
  D.estado.cierres[mk]=Math.round(n); guardarLocal(); encolarEstado(); pintar();
}
function ajusteColchon(){
  var v=prompt("Ajuste al colchón (negativo resta):","");
  if(v===null) return;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  if(isNaN(n)||n===0) return;
  var nota=prompt("Nota (opcional):","")||"";
  D.estado.ajustes.push({fecha:ymd(new Date()),monto:Math.round(n),nota:nota});
  guardarLocal(); encolarEstado(); pintar();
}

/* ---------- pintado ---------- */
function pintar(){
  pintarSemana(); pintarMes(); pintarSobres(); pintarColchon();
}

function pintarSemana(){
  var s=saldoSemana(), c=clase(s.saldo), l=proxLunes(new Date());
  var pct=Math.max(0,Math.min(1,Math.max(0,s.saldo)/CFG.monto_semanal));
  var h='<div class="hero">'+
    '<div class="cifra '+c+'">'+mx(Math.abs(s.saldo))+'</div>'+
    '<div class="pie">'+(s.saldo<0?"te pasaste por esto":"te quedan esta semana")+'</div>'+
    '<div class="barra"><i style="width:'+(pct*100).toFixed(1)+'%;background:'+colorDe(c)+'"></i></div>'+
    '<div class="reinicio">se reinicia el lunes '+l.getDate()+' de '+MESES[l.getMonth()]+'</div>'+
    '</div>';

  var ms=movsSemana().slice().sort(function(a,b){return b.id<a.id?-1:1});
  h+='<div class="rotulo"><span>Esta semana</span><span>gastado '+mx(s.gastado)+' de '+mx(CFG.monto_semanal)+'</span></div>';
  if(!ms.length) h+='<div class="lista"><div class="vacio">Semana limpia. Nada capturado todavía.</div></div>';
  else{
    h+='<div class="lista">';
    ms.forEach(function(m){
      var ct=CFG.categorias.filter(function(x){return x.id===m.categoria})[0];
      h+='<button class="row" type="button" data-borrar="'+esc(m.id)+'">'+
         '<span class="ic">'+(ct?ct.emoji:"•")+'</span>'+
         '<span class="tx"><b>'+esc(ct?ct.nombre:m.categoria)+'</b><small>'+esc(m.fecha)+
         (m.nota?" · "+esc(m.nota):"")+'</small></span>'+
         '<span class="mt neg">'+mx(m.monto)+'</span></button>';
    });
    h+='</div><div class="nota">Toca un gasto para borrarlo.</div>';
  }
  $("#t-semana").innerHTML=h;
}

function pintarMes(){
  var mk=mesVista;
  var marcas=D.estado.checklist[mk]||{};
  var ings=ingresosDelMes(mk);
  var pagos=itemsDia1(mk).concat(itemsDia15());
  var movs=D.movimientos.filter(function(m){return m.fecha.slice(0,7)===mk});

  var entro=ings.reduce(function(a,i){var r=recibidoDe(mk,i);return a+(r?r.monto:0)},0);
  var planeado=ings.reduce(function(a,i){return a+i.monto},0);
  var pagado=pagos.filter(function(p){return marcas[p.id]})
    .reduce(function(a,b){return a+b.monto},0);
  var gastado=movs.reduce(function(a,b){return a+b.monto},0);
  var queda=entro-pagado-gastado;

  var h='<div class="mesnav"><h2>'+nombreMes(mk)+'</h2>'+
    '<button type="button" data-mes="-1">◀︎</button>'+
    '<button type="button" data-mes="1">▶︎</button></div>'+
    '<div class="trio">'+
    '<div class="tile"><b style="color:var(--mint)">'+mx(entro)+'</b><small>entró</small></div>'+
    '<div class="tile"><b>'+mx(pagado+gastado)+'</b><small>salió</small></div>'+
    '<div class="tile"><b style="color:'+(queda<0?"var(--coral)":"var(--text)")+'">'+mx(queda)+'</b><small>queda</small></div>'+
    '</div>'+
    '<div class="nota">Falta por caer '+mx(planeado-entro)+' · falta por pagar '+
      mx(suma(pagos)-pagado)+' · gastos '+mx(gastado)+'</div>';

  if(!ings.length){
    h+='<div class="nota" style="color:var(--brass);margin-top:10px">'+
       'Este mes no está en el calendario de ingresos: arranca en octubre 2026. '+
       'Los gastos sí se registran igual.</div>';
  }

  var ya=[],falta=[];
  ings.forEach(function(i){
    var r=recibidoDe(mk,i);
    var it={tipo:"ingreso",ic:r?"💰":"⬜️",tit:i.fuente==="colegio"?"Colegio":"UVEG",
      dia:i.dia,monto:r?r.monto:i.monto,hecho:!!r,
      sub:"día "+i.dia+(r?" · registrado el "+r.fecha:""),ref:idIng(i)};
    (r?ya:falta).push(it);
  });
  pagos.forEach(function(p){
    var m=marcas[p.id];
    var it={tipo:"pago",ic:m?"✅":"⬜️",tit:p.concepto,dia:p.dia,monto:p.monto,hecho:!!m,
      sub:"día "+p.dia+(p.sobre?" · sobre "+p.sobre:"")+(typeof m==="string"?" · pagado el "+m:""),
      ref:p.id};
    (m?ya:falta).push(it);
  });
  movs.forEach(function(m){
    var ct=CFG.categorias.filter(function(x){return x.id===m.categoria})[0];
    ya.push({tipo:"gasto",ic:ct?ct.emoji:"•",tit:ct?ct.nombre:m.categoria,
      dia:+m.fecha.slice(8,10),monto:m.monto,hecho:true,
      sub:m.fecha+(m.nota?" · "+m.nota:""),ref:m.id});
  });
  ya.sort(function(a,b){return b.dia-a.dia});
  falta.sort(function(a,b){return a.dia-b.dia});

  function bloque(titulo,arr,vacio){
    var s='<div class="rotulo"><span>'+titulo+'</span><span>'+arr.length+'</span></div>';
    if(!arr.length) return s+'<div class="lista"><div class="vacio">'+vacio+'</div></div>';
    s+='<div class="lista">';
    arr.forEach(function(it){
      var pos=it.tipo==="ingreso";
      s+='<button class="row'+(it.hecho&&it.tipo==="pago"?" hecho":"")+'" type="button" '+
         'data-tipo="'+it.tipo+'" data-ref="'+esc(it.ref)+'">'+
         '<span class="ic">'+it.ic+'</span>'+
         '<span class="tx"><b>'+esc(it.tit)+'</b><small>'+esc(it.sub)+'</small></span>'+
         '<span class="mt '+(pos?"pos":"neg")+'">'+(pos?"+":"−")+mx(it.monto)+'</span></button>';
    });
    return s+'</div>';
  }
  h+=bloque("Ya pasó",ya,"Nada todavía en "+nombreMes(mk));
  h+=bloque("Falta",falta,"Mes completo 🎉");

  var cerrado=D.estado.cierres[mk];
  h+='<button class="btn '+(cerrado!==undefined?"gris":"")+'" type="button" data-cerrar="1">'+
     (cerrado!==undefined?"Mes cerrado · "+mx(cerrado)+" al colchón":"Cerrar el mes y barrer al colchón")+
     '</button>';
  h+='<div class="nota">SAT de '+nombreMes(mk)+': '+mx(satDelMes(mk))+
     ' — 8% de '+mx(depColegioReal(mk))+'</div>';

  $("#t-mes").innerHTML=h;
}

function pintarSobres(){
  var mk=mesKey(new Date()), marcas=D.estado.checklist[mk]||{}, s=saldoSemana();
  var prog=CFG.pagos_fijos.filter(function(p){return p.sobre==="programados"})
    .reduce(function(a,b){return a+b.monto},0);
  var progHecho=(marcas["f:PPR Allianz Optimaxx"]?2000:0)+(marcas["f:Seguro Allianz"]?250:0);
  var sat=satDelMes(mk);
  var lista=[
    {n:"Mis semanas",b:"gastos de gustos",d:s.saldo,t:s.asignado},
    {n:"SAT",b:"ni te atrevas",d:marcas["f:SAT"]?0:sat,t:sat},
    {n:"Ahorro casa",b:"Ahorro",d:marcas["f:Ahorro casa"]?0:1000,t:1000},
    {n:"Pagos programados",b:"gastos",d:prog-progHecho,t:prog},
    {n:"Colchón",b:"Open Bank",d:colchonActual(),t:CFG.meta_colchon}
  ];
  var h='<div class="rotulo"><span>Sobres · '+nombreMes(mk)+'</span><span>solo lectura</span></div><div class="lista">';
  lista.forEach(function(x){
    h+='<div class="row"><span class="ic">✉</span>'+
       '<span class="tx"><b>'+esc(x.n)+'</b><small>BBVA · '+esc(x.b)+'</small></span>'+
       '<span class="mt '+(x.d<0?"mal":"neg")+'">'+mx(x.d)+'</span></div>';
  });
  h+='</div><div class="nota">Espejo de tus apartados. El disponible sale de lo que ya palomeaste en Mes.</div>';
  $("#t-sobres").innerHTML=h;
}

function pintarColchon(){
  var a=colchonActual(), falta=Math.max(0,CFG.meta_colchon-a);
  var pct=Math.max(0,Math.min(1,a/CFG.meta_colchon));
  var h='<div class="hero">'+
    '<div class="cifra v">'+mx(a)+'</div>'+
    '<div class="pie">'+(falta>0?"faltan "+mx(falta)+" para los "+mx(CFG.meta_colchon):"meta alcanzada 🎉")+'</div>'+
    '<div class="barra"><i style="width:'+(pct*100).toFixed(1)+'%;background:var(--mint)"></i></div>'+
    '</div>';
  var p=proyeccion();
  h+='<div class="rotulo"><span>Proyección</span><span>acumulado</span></div><div class="lista">';
  if(!p.length) h+='<div class="vacio">Sin meses por delante en el calendario.</div>';
  p.forEach(function(f){
    var exc=depColegio(f.mes)-CFG.meta_colchon;
    var etiqueta = exc>0 ? "mes alto, sobran "+mx(exc)
                 : (lunesDelMes(f.mes)===5 ? "5 lunes" : "");
    h+='<div class="row"><span class="ic">▲</span>'+
       '<span class="tx"><b>'+nombreMes(f.mes).split(" ")[0]+'</b><small>'+
       (etiqueta?etiqueta+' · ':'')+'entra '+mx(f.entra)+'</small></span>'+
       '<span class="mt '+(f.acum>=CFG.meta_colchon?"pos":"neg")+'">'+mx(f.acum)+'</span></div>';
  });
  h+='</div>';
  h+='<button class="btn gris" type="button" data-ajuste="1">＋ Ajuste manual al colchón</button>';
  if(D.estado.ajustes.length){
    h+='<div class="rotulo"><span>Ajustes</span><span>'+D.estado.ajustes.length+'</span></div><div class="lista">';
    D.estado.ajustes.slice().reverse().forEach(function(x){
      h+='<div class="row"><span class="ic">•</span>'+
         '<span class="tx"><b>'+esc(x.nota||"ajuste manual")+'</b><small>'+esc(x.fecha)+'</small></span>'+
         '<span class="mt '+(x.monto>0?"pos":"mal")+'">'+(x.monto>0?"+":"")+mx(x.monto)+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="rotulo"><span>Ajustes de la app</span><span></span></div>'+
     '<div class="campo"><label>Dirección de tu hoja de Google</label>'+
     '<input id="ep" placeholder="https://script.google.com/…/exec" value="'+esc(ENDPOINT)+'"></div>'+
     '<button class="btn" type="button" data-guardarep="1">Guardar y sincronizar</button>'+
     '<div class="nota">Sin dirección, la app funciona igual pero solo en este teléfono.</div>';
  $("#t-colchon").innerHTML=h;
}

/* ---------- teclado ---------- */
var buffer="0";
function abrirPad(){
  buffer="0"; pintarPad();
  var s=saldoSemana();
  $("#padPie").textContent = s.saldo>=0
    ? "te quedan "+mx(s.saldo)+" esta semana"
    : "vas "+mx(Math.abs(s.saldo))+" pasado";
  $("#velo").classList.add("on"); $("#pad").classList.add("on");
}
function cerrarPad(){ $("#velo").classList.remove("on"); $("#pad").classList.remove("on") }
function pintarPad(){
  var el=$("#monto");
  el.textContent = "$"+(buffer==="0"?"0":sep(buffer.split(".")[0])+(buffer.indexOf(".")>=0?"."+buffer.split(".")[1]:""));
  el.className = "mono"+(buffer==="0"?" cero":"");
}
function tecla(t){
  if(t==="⌫"){ buffer=buffer.length>1?buffer.slice(0,-1):"0"; }
  else if(t==="."){ if(buffer.indexOf(".")<0) buffer+="."; }
  else { if(buffer==="0") buffer=t; else if(buffer.replace(".","").length<7) buffer+=t; }
  pintarPad();
}

/* ---------- arranque ---------- */
function montarTeclado(){
  var tl=["1","2","3","4","5","6","7","8","9",".","0","⌫"], h="";
  tl.forEach(function(t){h+='<button type="button" data-k="'+t+'">'+t+'</button>'});
  $("#teclas").innerHTML=h;
  h="";
  CFG.categorias.forEach(function(c){
    h+='<button type="button" data-c="'+c.id+'"><span class="ce">'+c.emoji+'</span>'+c.nombre+'</button>';
  });
  $("#cats").innerHTML=h;
}

function irA(t){
  tabActual=t;
  document.querySelectorAll(".tab").forEach(function(s){s.classList.remove("on")});
  $("#t-"+t).classList.add("on");
  document.querySelectorAll("nav button").forEach(function(b){
    b.classList.toggle("on", b.dataset.t===t)});
  $("#titulo").textContent={semana:"Esta semana",mes:"Este mes",
    sobres:"Sobres",colchon:"Colchón"}[t];
  document.querySelector("main").scrollTop=0;
}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b) return;

  if(b.dataset.t){ irA(b.dataset.t); return }
  if(b.id==="fab"){ abrirPad(); return }
  if(b.id==="padCerrar"){ cerrarPad(); return }
  if(b.id==="sync"){ sincronizar(); return }
  if(b.dataset.k!==undefined){ tecla(b.dataset.k); return }
  if(b.dataset.c){
    var n=parseFloat(buffer);
    if(!n||isNaN(n)||n<=0){ cerrarPad(); return }
    agregarGasto(n,b.dataset.c); cerrarPad(); return;
  }
  if(b.dataset.borrar){
    if(confirm("¿Borrar este gasto?")) borrarGasto(b.dataset.borrar);
    return;
  }
  if(b.dataset.mes){
    var d=deYmd(mesVista+"-01"); d.setMonth(d.getMonth()+ +b.dataset.mes);
    mesVista=mesKey(d); pintarMes(); return;
  }
  if(b.dataset.tipo==="pago"){ togglePago(mesVista,b.dataset.ref); return }
  if(b.dataset.tipo==="ingreso"){
    var ing=ingresosDelMes(mesVista).filter(function(i){return idIng(i)===b.dataset.ref})[0];
    if(ing) marcarIngreso(mesVista,ing);
    return;
  }
  if(b.dataset.tipo==="gasto"){
    if(confirm("¿Borrar este gasto?")) borrarGasto(b.dataset.ref);
    return;
  }
  if(b.dataset.cerrar){ cerrarMes(mesVista); return }
  if(b.dataset.ajuste){ ajusteColchon(); return }
  if(b.dataset.guardarep){
    ENDPOINT=$("#ep").value.trim();
    try{ localStorage.setItem("dinero.endpoint",ENDPOINT) }catch(e){}
    pintarSync(ENDPOINT?"pend":"");
    sincronizar();
    return;
  }
});
$("#velo").addEventListener("click",cerrarPad);

cargarLocal();
montarTeclado();
pintar();
pintarSync(ENDPOINT?(COLA.length?"pend":"ok"):"");
sincronizar();
setInterval(sincronizar, 60000);
window.addEventListener("online", sincronizar);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){ pintar(); sincronizar() }
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
